                lesson: >
                  Critic agreement and dataset support do not establish that the critic is competent for the current control task; critic training-outcome competence must independently limit gradient authority.
                evidence: [C80, H59, "results/research_platform/rl/gate2_value_alignment_paired_l188/paired_comparison.json", "docs/rl/173_gate2_competence_gated_value_alignment_results_2026-07-18.md"]
