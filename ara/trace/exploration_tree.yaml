                                                                                                        from: "Always-on full-strength ICODE after task-specific retraining"
                                                                                                        to: "A fail-closed residual-reliability gate based only on past nominal-versus-ICODE one-step innovation"
                                                                                                        trigger: "L50 reproduced significant smoothness benefit under stronger mismatch but near-zero benefit under matched delay, while its all-domain joint gate remained failed."
                                                                                                        children:
                                                                                                          - id: N70
                                                                                                            type: experiment
                                                                                                            title: "L51 oracle-domain residual-authority upper bound"
                                                                                                            provenance: ai-executed
                                                                                                            timestamp: "2026-07-16T15:40:00+08:00"
                                                                                                            result: >
                                                                                                              A simulator-label oracle gate completed 540 episodes and passed its upper-bound smoothness gate: issued and applied jerk reductions were positive in all three model blocks with hierarchical-bootstrap intervals above zero and unchanged success/collision. This established that conditional residual authority could help, while remaining explicitly non-deployable.
                                                                                                            evidence: [C50, "results/research_platform/rl/l51_icode_oracle_domain_gate_20260716_v1/oracle_gate_summary.json"]
                                                                                                            children:
                                                                                                              - id: N71
                                                                                                                type: dead_end
                                                                                                                title: "Use prediction-relative innovation alone to infer residual utility"
                                                                                                                provenance: ai-executed
                                                                                                                timestamp: "2026-07-16T16:05:00+08:00"
                                                                                                                hypothesis: >
                                                                                                                  A causal exponentially forgotten comparison of nominal and residual one-step errors would separate matched-delay and stronger-delay domains strongly enough to reproduce the L51 oracle gate without simulator labels.
                                                                                                                failure_mode: >
                                                                                                                  None of 36 frozen L52 candidates passed; the best worst-block alpha separation was only 0.0283 against a 0.25 requirement because the two predictors' one-step errors were too similar for reliable benefit classification.
                                                                                                                lesson: >
                                                                                                                  Prediction accuracy and closed-loop residual usefulness are not identical latent quantities. A deployable authority gate may combine causal innovation with directly measurable plant context, but must not infer hidden domain labels.
                                                                                                                evidence: [C51, H35, "results/research_platform/rl/l52_icode_online_reliability_calibration_20260716_v1/reliability_calibration_summary.json"]
                                                                                                                children:
                                                                                                                  - id: N72
                                                                                                                    type: experiment
                                                                                                                    title: "L53 causal cross-layer reliability calibration"
                                                                                                                    provenance: ai-executed
                                                                                                                    timestamp: "2026-07-16T16:25:00+08:00"
                                                                                                                    result: >
                                                                                                                      Combining past-transition innovation evidence with the measurable command-delay/control-period ratio yielded ten passing candidates out of 48. The selected candidate failed closed, matched alpha zero in the low-delay domain, and produced mean alpha 0.718-0.750 in long-delay blocks without using a hidden domain string.
                                                                                                                    evidence: [H36, "results/research_platform/rl/l53_icode_cross_layer_reliability_calibration_20260716_v1/reliability_calibration_summary.json"]
                                                                                                                    children:
                                                                                                                      - id: N73
                                                                                                                        type: experiment
                                                                                                                        title: "L54-L55 independent gate evaluation"
                                                                                                                        provenance: ai-executed
                                                                                                                        timestamp: "2026-07-16T17:05:00+08:00"
                                                                                                                        result: >
                                                                                                                          L54 failed its tracking clause despite small positive path and jerk effects. The preregistered L55 path-efficiency confirmation also failed because path-length uncertainty crossed zero; significant secondary jerk reductions could not be relabeled as the primary result. The same-domain practical effects were too small to justify adding more identical seeds.
                                                                                                                        evidence: [C51, "docs/rl/78_l54_causal_reliability_gate_results_2026-07-16.md", "docs/rl/79_l55_path_efficiency_confirmation_results_2026-07-16.md", "docs/rl/80_l55_practical_effect_analysis_2026-07-16.md"]
