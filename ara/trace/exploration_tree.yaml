                                                                                                            title: "Can paired BC/SAC candidate previews predict macro-policy utility?"
                                                                                                            provenance: ai-suggested
                                                                                                            timestamp: "2026-07-15T14:00:00+08:00"
                                                                                                            description: >
                                                                                                              Compare paired MPPI candidate trajectories with common random numbers and test whether progress, clearance, smoothness, cost-distribution and sampling diagnostics improve forty-step utility prediction over an identical state-only ensemble.
                                                                                                            children:
                                                                                                              - id: N28
                                                                                                                type: experiment
                                                                                                                title: "L24 paired candidate-trajectory utility ablation"
                                                                                                                provenance: ai-executed
                                                                                                                timestamp: "2026-07-15T14:35:00+08:00"
                                                                                                                result: >
                                                                                                                  Side-effect-free preview passed exact regression and 409 accepted branches were collected in 108 independent checkpoint-episode groups with 127 frozen features. The trajectory ensemble achieved 5.075 cm selection RMSE versus 5.024 cm for the same-data state-only ensemble, only 57.74% balanced sign accuracy and zero calibrated acceptance. No trajectory metric had a stable same-sign group correlation of at least absolute 0.2 across train, selection and calibration. The gate failed and all sealed test groups remained unopened.
                                                                                                                evidence: [C18, C19, C20, H13, H14, H15, "docs/rl/30_l24_trajectory_utility_results_2026-07-15.md"]
                                                                                                                children:
                                                                                                                  - id: N29
                                                                                                                    type: dead_end
                                                                                                                    title: "One-preview prediction of repeated-replanning burst utility"
                                                                                                                    provenance: ai-executed
                                                                                                                    timestamp: "2026-07-15T14:38:00+08:00"
                                                                                                                    hypothesis: >
                                                                                                                      A paired current-step BC/SAC candidate preview contains the missing trajectory context needed to predict the subsequent ten-step correction burst's forty-step outcome.
                                                                                                                    failure_mode: >
                                                                                                                      The full representation was worse than the state-only ablation on row and group RMSE, reduced negative-effect sign accuracy, failed to beat zero by the preregistered margin, and required a 14.44 conformal multiplier that accepted no rows.
                                                                                                                    lesson: >
                                                                                                                      The preview describes only the current optimization, while the treatment outcome depends on ten future sensing, sampling, replanning, gating and safety-arbitration rounds. More model capacity cannot recover random future information absent from the representation.
                                                                                                                    children:
                                                                                                                      - id: N30
                                                                                                                        type: pivot
                                                                                                                        title: "Simplify to auditable OOD-conditioned RL prior activation"
                                                                                                                        provenance: ai-suggested
                                                                                                                        timestamp: "2026-07-15T14:40:00+08:00"
                                                                                                                        from: "Learned prediction of the future macro-utility of each correction burst"
                                                                                                                        to: "Traditional MPPI/BC in simple in-distribution scenes, with interpretable OOD or scene-complexity activation of the RL sampling prior and an independent ICODE ablation"
                                                                                                                        trigger: "L18--L24 repeatedly failed safe learned-gate eligibility, while L20 still showed that critic-guided correction can provide directional benefit and the advisor requested a narrower, technically auditable story."
                                                                                                                        children:
                                                                                                                          - id: N31
                                                                                                                            type: question
                                                                                                                            title: "Can observable scene complexity activate the RL prior only where it is useful?"
                                                                                                                            provenance: ai-suggested
                                                                                                                            timestamp: "2026-07-15T14:45:00+08:00"
                                                                                                                            description: >
                                                                                                                              Use only local LaserScan geometry to interpolate between exact traditional-MPPI fallback and the L20 target-critic LCB prior, then test it with paired scenes, episode seeds and independently trained checkpoints.
                                                                                                                            children:
                                                                                                                              - id: N32
                                                                                                                                type: experiment
                                                                                                                                title: "L25 LaserScan scene-complexity gate ablation"
                                                                                                                                provenance: ai-executed
                                                                                                                                timestamp: "2026-07-15T15:25:00+08:00"
                                                                                                                                result: >
                                                                                                                                  Three independent checkpoints, ten paired episode seeds, four scenes and four methods produced 480 episodes and 124334 control steps at K=200. Complexity gating exactly matched traditional MPPI in obstacle-free geometry, improved traditional success from 0/30 to 20/30, 24/30 and 26/30 in the three blocking scenes, and caused no collision in any episode. It did not uniformly dominate frozen BC or always-on LCB. The preregistered gate failed only because the globally simple single-obstacle scene raised pooled simple-scene alpha and active fraction above their limits; sealed test seeds remained unopened.
                                                                                                                                evidence: [C21, C22, C23, C24, H16, H17, "docs/rl/32_l25_scene_complexity_gate_results_2026-07-15.md"]
                                                                                                                                children:
                                                                                                                                  - id: N33
                                                                                                                                    type: dead_end
                                                                                                                                    title: "Use global simple-versus-complex scene labels as the gating target"
                                                                                                                                    provenance: ai-executed
                                                                                                                                    timestamp: "2026-07-15T15:28:00+08:00"
                                                                                                                                    hypothesis: >
                                                                                                                                      A globally sparse single-obstacle scene should require little RL activation and can be pooled with obstacle-free dynamics under one simple-scene gate limit.
                                                                                                                                    failure_mode: >
                                                                                                                                      At K=200 traditional MPPI failed all 30 single-obstacle episodes, while local LaserScan activation recovered 20 successes. Pooling this scene with obstacle-free dynamics made the preregistered simple alpha and active-fraction limits fail despite no performance or safety regression.
                                                                                                                                    lesson: >
                                                                                                                                      Gating should be evaluated against local control difficulty and observable geometry, not obstacle count or a global scene name.
                                                                                                                                    children:
                                                                                                                                      - id: N34
                                                                                                                                        type: pivot
                                                                                                                                        title: "Test RL-prior value as a sample-efficiency interaction"
                                                                                                                                        provenance: ai-suggested
                                                                                                                                        timestamp: "2026-07-15T15:30:00+08:00"
                                                                                                                                        from: "A fixed K=200 comparison organized by global simple and complex scene labels"
                                                                                                                                        to: "A blocked K=50,100,200,400 factorial using new seeds and local LaserScan gate diagnostics"
                                                                                                                                        trigger: "L25 showed strong local activation value but could not determine whether the learned prior mainly compensates for a limited MPPI sampling budget."
                                                                                                                                        children:
                                                                                                                                          - id: N37
                                                                                                                                            type: experiment
                                                                                                                                            title: "L26 scene-complexity gate sample-efficiency factorial"
                                                                                                                                            provenance: ai-executed
                                                                                                                                            timestamp: "2026-07-15T16:35:00+08:00"
                                                                                                                                            result: >
                                                                                                                                              Three independent checkpoints, ten new episode seeds, four scenes, two methods and K in 50,100,200,400 produced all 960 planned episodes and 250676 control steps with zero collision. At K=100 the gated prior achieved 20/30, 19/30 and 20/30 successes in the three blocking scenes, while traditional MPPI at K=400 achieved 6/30, 0/30 and 0/30. However, gated K=100 used 8.663 ms/step versus 9.168 ms/step for traditional K=400, a 0.945 ratio that failed the preregistered 0.60 compute threshold. Sealed seeds remained unopened.
                                                                                                                                            evidence: [C26, C27, H21, "docs/rl/34_l26_sample_efficiency_results_2026-07-15.md"]
                                                                                                                                            children:
                                                                                                                                              - id: N38
                                                                                                                                                type: dead_end
                                                                                                                                                title: "Equate lower MPPI sample count with proportional wall-clock speedup"
                                                                                                                                                provenance: ai-executed
                                                                                                                                                timestamp: "2026-07-15T16:38:00+08:00"
                                                                                                                                                hypothesis: >
                                                                                                                                                  Reducing K from 400 to 100 with a learned sampling prior would reduce total planner time by at least forty percent while preserving or improving blocking-scene success.
                                                                                                                                                failure_mode: >
                                                                                                                                                  Actor, target twin-critic and decoder inference remained a fixed per-step cost even when the outer scene-complexity gate ultimately set the learned contribution to zero; the observed planner-time ratio was 0.945.
                                                                                                                                                lesson: >
                                                                                                                                                  Sample efficiency and compute efficiency require separate estimands and gates; neural inference must be profiled and optimized without changing controls.
                                                                                                                                                children:
                                                                                                                                                  - id: N39
                                                                                                                                                    type: question
                                                                                                                                                    title: "Can provably inactive learned inference be skipped without changing behavior?"
                                                                                                                                                    provenance: ai-suggested
                                                                                                                                                    timestamp: "2026-07-15T16:40:00+08:00"
                                                                                                                                                    description: >
                                                                                                                                                      Compare standard complexity gating against a fast path that returns the same conventional prior only when complexity, near-goal or safety logic guarantees final alpha zero and learned covariance is disabled.
                                                                                                                                                    children:
                                                                                                                                                      - id: N40
                                                                                                                                                        type: experiment
                                                                                                                                                        title: "L27 zero-complexity behavior-preserving fast path"
                                                                                                                                                        provenance: ai-executed
                                                                                                                                                        timestamp: "2026-07-15T17:05:00+08:00"
                                                                                                                                                        result: >
                                                                                                                                                          Three checkpoints, ten new episode seeds, four scenes and two paired K=100 conditions produced all 240 episodes. Across 26208 paired control steps, executed v, omega, goal distance, gate alpha, collision and safety behavior matched exactly. The fast path skipped all learned inference in clean geometry and 31.6% in blocking scenes, reducing planner time by 23.6% (95% CI 19.9--27.1%) and 9.4% (7.6--11.5%), respectively. Every preregistered development check passed; protected seeds remained unopened.
                                                                                                                                                        evidence: [C28, H22, "docs/rl/36_l27_zero_complexity_fastpath_results_2026-07-15.md"]
                                                                                                                                                        children:
                                                                                                                                                          - id: N41
                                                                                                                                                            type: question
                                                                                                                                                            title: "Can active-gate inference be pruned exactly enough to close the compute gap?"
                                                                                                                                                            provenance: ai-suggested
                                                                                                                                                            timestamp: "2026-07-15T19:40:00+08:00"
                                                                                                                                                            description: >
                                                                                                                                                              Profile the actor, critic diagnostics, decoder and MPPI solve at K=100, then compare full diagnostics, selected-target-critic inference and selected-target-critic inference with actor-base reuse under exact paired behavior checks and fixed practical timing thresholds.
                                                                                                                                                            children:
                                                                                                                                                              - id: N42
                                                                                                                                                                type: experiment
                                                                                                                                                                title: "L28 active-prior inference profiling and exact pruning"
                                                                                                                                                                provenance: ai-executed
                                                                                                                                                                timestamp: "2026-07-15T20:20:00+08:00"
                                                                                                                                                                result: >
                                                                                                                                                                  Three checkpoints, ten new development seeds and seven scenes produced all 360 episodes and 79734 steps. Both optimized conditions exactly matched the full reference across 26578 paired steps each. Selected-critic-only reduced active-prior time by 12.26% and blocking planner time by 3.07%; adding actor-base reuse reduced them by 14.89% and 4.07%, with a two-stage bootstrap 95% CI of 1.94--6.05% for the planner reduction. The preregistered 15%/20% prior and 5% end-to-end magnitude gates were not all met, so L28 failed and cross-K plus sealed seeds remained unopened.
                                                                                                                                                                evidence: [C29, C30, H23, "docs/rl/38_l28_inference_profile_results_2026-07-15.md"]
                                                                                                                                                                children:
                                                                                                                                                                  - id: N43
                                                                                                                                                                    type: dead_end
                                                                                                                                                                    title: "Diagnostic pruning alone as a complete L26 compute remedy"
                                                                                                                                                                    provenance: ai-executed
                                                                                                                                                                    timestamp: "2026-07-15T20:22:00+08:00"
                                                                                                                                                                    hypothesis: >
                                                                                                                                                                      Removing unselected online-critic diagnostics and reusing the already-computed actor base action would reduce active-prior time by at least 20% and blocking-scene planner time by at least 5% without changing behavior.
                                                                                                                                                                    failure_mode: >
                                                                                                                                                                      The behavior contract passed exactly and the speedup confidence interval excluded zero, but the observed reductions were only 14.89% for active prior and 4.07% end to end. Actor and decoder inference remained major fixed components.
                                                                                                                                                                    lesson: >
                                                                                                                                                                      Preserve the optimization as an optional exact improvement, but do not claim it closes the compute gap or chase the preregistered thresholds post hoc. Any decoder or inference-context optimization requires a new study and new development seeds.

