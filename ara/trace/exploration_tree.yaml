tree:
  - id: N103
    type: experiment
    title: "L96 blocked 2x2 jerk-remediation screen"
    also_depends_on: [N102]
    provenance: ai-executed
    timestamp: "2026-07-18T19:15:00+08:00"
    result: >
      All 96 episodes and 24 blocks completed with 96 successes and zero collisions. The hard yaw-slew and combined arms both passed all selection gates; doubling only the predictive rate cost failed both jerk gates. The preregistered rule selected the combined arm, which reduced issued jerk by 0.00941 and applied jerk by 0.00608 with both intervals strictly below zero while preserving precision and time.
    evidence: [C71, H51, "results/research_platform/rl/l96_contextual_covariance_jerk_screening_20260718_v1/summary.json", "docs/rl/148_l96_jerk_screening_results_and_l97_prereg_2026-07-18.md"]
    children:
      - id: N104
        type: experiment
        title: "L97 single-process three-arm jerk confirmation"
        provenance: ai-executed
        timestamp: "2026-07-18T20:55:00+08:00"
        result: >
          All 144 episodes and 48 untouched-seed blocks completed with 144 successes and zero collisions. Raw contextual K50 again beat fixed K100 on time and compute with precision noninferiority. Smoothed K50 reduced issued jerk by 0.01078 and applied jerk by 0.00705 versus raw K50 with intervals below zero. Versus fixed K100 its mean jerk was slightly lower, but issued and applied intervals crossed zero; the preregistered overall Gate therefore failed.
        evidence: [C69, C70, C71, C72, H52, "results/research_platform/rl/l97_contextual_covariance_jerk_confirmation_20260718_v1/summary.json", "docs/rl/149_l97_contextual_covariance_jerk_confirmation_results_2026-07-18.md", "ara/evidence/figures/fig10_l96_l97_jerk_remediation.md"]
        children:
          - id: N105
            type: decision
            title: "Defer CUDA acceleration absent experimental benefit"
            provenance: user
            timestamp: "2026-07-18T20:35:00+08:00"
            choice: >
              Keep the current CPU benchmark and do not add CUDA unless later profiling demonstrates a task-relevant real-time bottleneck or experimental benefit.
            alternatives:
              - "Immediately implement a torch_cuda MPPI rollout backend"
            evidence: >
              MuJoCo and the current NumPy MPPI are CPU-oriented, while L97 requires a stable single-process CPU timing contract; CUDA would add a new engineering variable without strengthening the current claim.
  - id: N97
    type: dead_end
    title: "L90 route-local covariance oracle"
    provenance: ai-executed
    timestamp: "2026-07-18T12:30:00+08:00"
    hypothesis: >
      Local route windows contain enough observable covariance heterogeneity to justify segment-level contextual switching above the confirmed route-level bandit.
    failure_mode: >
      The oracle selected speed in 11 of 12 route-progress contexts; progress changed by only +0.001385 m with interval [0, +0.004884] m and RMSE by -0.000107 m with interval [-0.000481, +0.000080] m. The preregistered heterogeneity and practical-progress gates failed.
    lesson: >
      Retain one covariance action per route and do not add high-frequency policy authority without oracle headroom at that action timescale.
    evidence: [C65, H47, "results/research_platform/rl/l90_local_covariance_context_oracle_20260718_v1/summary.json", "docs/rl/137_l90_local_covariance_context_oracle_results_2026-07-18.md"]
    children:
      - id: N98
        type: experiment
        title: "L91 dynamic-scene covariance oracle"
        provenance: ai-executed
        timestamp: "2026-07-18T13:30:00+08:00"
        result: >
          Across 160 complete episodes, a scene-label oracle selected clean baseline, easy speed, moderate broad and hard speed. Versus global turn it improved success by +0.30 with interval [+0.05, +0.55] and collision by -0.15 with interval [-0.40, 0], but elapsed time had interval [-9.025, +3.165] s and failed the original elapsed gate. The safety pattern remained exploratory pending independent geometry confirmation.
        evidence: [C66, H48, "results/research_platform/rl/l91_dynamic_covariance_context_oracle_20260718_v1/summary.json", "docs/rl/138_l91_dynamic_obstacle_covariance_oracle_results_2026-07-18.md"]
        children:
          - id: N99
            type: dead_end
            title: "L92 independent dynamic-safety confirmation"
            provenance: ai-executed
            timestamp: "2026-07-18T14:25:00+08:00"
            hypothesis: >
              The L91 scene-level covariance mapping generalizes its apparent safety improvement to six pre-existing dynamic-motion geometries.
            failure_mode: >
              All 300 episodes completed, but held-out success changed by +0.0556 with interval [-0.1389, +0.25] and collision by 0 with interval [-0.1389, +0.1667]. The safety confirmation gate failed.
            lesson: >
              Do not convert a development safety pattern into a dynamic-scene policy claim until the effect reproduces on independent motion geometries.
            evidence: [C66, H48, "results/research_platform/rl/l92_dynamic_covariance_safety_confirmation_20260718_v1/summary.json", "docs/rl/140_l92_dynamic_covariance_safety_confirmation_results_2026-07-18.md"]
            children:
              - id: N100
                type: dead_end
                title: "L93 route-crossing dynamic covariance headroom"
                provenance: ai-executed
                timestamp: "2026-07-18T15:10:00+08:00"
                hypothesis: >
                  Narrow, turn or speed covariance selection can recover measurable safety headroom on cleanly isolated route-crossing dynamic obstacles.
                failure_mode: >
                  The 120-episode oracle produced no success or collision change, elapsed interval [-2.236, +1.296] s, and no practical headroom. Fast and large crossing variants made every candidate collide in selection, exposing missing future-motion information rather than a sampling-spread problem.
                lesson: >
                  Future dynamic-obstacle work needs an explicit motion-prediction or time-indexed occupancy layer; covariance selection should not be used to mask missing observability.
                evidence: [C67, H48, "results/research_platform/rl/l93_route_dynamic_covariance_headroom_20260718_v1/summary.json", "docs/rl/142_l93_route_dynamic_headroom_results_2026-07-18.md"]
                children:
                  - id: N101
                    type: experiment
                    title: "L94 contextual covariance sample-efficiency gate"
                    provenance: ai-executed
                    timestamp: "2026-07-18T16:30:00+08:00"
                    result: >
                      All 320 unique episodes completed on held-out hairpin and reverse-S routes, four physics domains, K in {50,100,200,400} and five new seeds. Learned K=50 versus fixed speed K=100 preserved success and zero collisions, reduced RMSE by 0.004108 m with interval [-0.007009, -0.000741], time by 1.7375 s with interval [-2.72, -0.76], and compute by 18.2905 ms/step with interval [-32.905, -2.693]. Jerk increased by 0.00944 with interval [+0.00330, +0.01573]. All preregistered primary gates passed.
                    evidence: [C68, C69, H50, "results/research_platform/rl/l94_contextual_covariance_sample_efficiency_20260718_v1/summary.json", "docs/rl/145_l94_contextual_covariance_sample_efficiency_results_2026-07-18.md"]
                    children:
                      - id: N102
                        type: experiment
                        title: "L95 controlled half-budget confirmation"
                        provenance: ai-executed
                        timestamp: "2026-07-18T17:20:00+08:00"
                        result: >
                          A single process with alternating arm order completed 40 untouched-seed pairs. Learned K=50 versus fixed K=100 preserved 80/80 success and zero collisions; RMSE changed by -0.000273 m with interval [-0.001816, +0.001520], time by -1.725 s with interval [-2.68, -0.77], and compute by -10.359 ms/step with interval [-15.085, -6.908]. The half-budget gate independently passed while confirming a +0.01029 jerk tradeoff.
                        evidence: [C68, C69, H49, H50, "results/research_platform/rl/l95_contextual_covariance_half_budget_confirmation_20260718_v1/summary.json", "docs/rl/146_l95_half_budget_controlled_confirmation_results_2026-07-18.md", "ara/evidence/figures/fig09_l94_l95_sample_efficiency.md"]
  - id: N89
    type: experiment
    title: "L82-L84 covariance adaptation qualification"
    provenance: ai-executed
    timestamp: "2026-07-17T21:00:00+08:00"
    result: >
      Fixed-sequence ranking did not favor ICODE over matched MLP, but a covariance oracle exposed substantial sampling headroom. Three covariance-only SAC blocks improved tracking over default and broad fixed covariances; versus the strongest fixed speed setting they were faster but less precise.
    evidence: ["docs/rl/126_l84_covariance_only_rl_results_2026-07-17.md"]
    children:
      - id: N90
        type: experiment
        title: "L85 precision-constrained free covariance policy"
        provenance: ai-executed
        timestamp: "2026-07-17T23:30:00+08:00"
        result: >
          A separate replay cost, resumable dual variable and feasible checkpoint selector were implemented. The 20k policy was 1.755 s faster than fixed speed but its RMSE was 3.899 mm worse and failed the +2 mm noninferiority gate.
        evidence: [C60, H44, "results/research_platform/rl/l85_precision_constrained_development_eval_20260717_v1/summary.json"]
        children:
          - id: N91
            type: experiment
            title: "L86 tuned-anchor bounded covariance residual"
            provenance: ai-executed
            timestamp: "2026-07-18T00:45:00+08:00"
            result: >
              Anchoring zero action and zero gate authority at fixed (1.75, 0.75) kept all validation checkpoints feasible. On 60 new-seed episodes the selected policy was 0.151 mm more precise on average with noninferiority CI upper bound +0.857 mm, but its -0.020 s time difference had CI [-0.130, +0.090] and failed superiority.
            evidence: [C61, C62, H44, "results/research_platform/rl/l86_anchored_covariance_development_eval_20260717_v1/summary.json", "docs/rl/129_l86_anchored_covariance_results_2026-07-17.md"]
            children:
              - id: N92
                type: decision
                title: "Require closed-loop context heterogeneity before more RL training"
                provenance: ai-suggested
                timestamp: "2026-07-18T00:50:00+08:00"
                decision: >
                  Freeze further covariance-policy scaling until a scene-by-physics-by-dynamic-obstacle oracle grid demonstrates that observable contexts require conflicting sampling optima and that a context oracle materially beats the best global fixed covariance.
                evidence: [H44, "docs/rl/129_l86_anchored_covariance_results_2026-07-17.md"]
                children:
                  - id: N93
                    type: experiment
                    title: "L87 closed-loop covariance-context oracle"
                    provenance: ai-executed
                    timestamp: "2026-07-18T08:30:00+08:00"
                    result: >
                      All 480 unique episodes completed. The oracle used narrow covariance for chicane and hairpin and speed covariance for accel-turn and reverse-S across four physics domains. Against the strongest global fixed speed covariance on 48 held-out pairs, time changed by -1.419 s with CI [-2.125, -0.712], RMSE by -0.772 mm with CI [-1.469, -0.152], and safety was unchanged.
                    evidence: [C63, H44, "results/research_platform/rl/l87_covariance_context_oracle_20260718_v1/summary.json", "docs/rl/131_l87_closed_loop_covariance_heterogeneity_results_2026-07-18.md"]
                    children:
                      - id: N94
                        type: dead_end
                        title: "Linear route-feature covariance critic"
                        provenance: ai-executed
                        timestamp: "2026-07-18T09:25:00+08:00"
                        hypothesis: >
                          A ridge-linear contextual reward critic over absolute turn, route indirectness and peak curvature would recover the supported narrow-versus-speed mapping.
                        failure_mode: >
                          The first critic selected speed even on the support-set chicane and therefore failed before any independent L89 confirmation seed was opened. The optimal action was non-monotonic across straight, medium-turn and high-turn paths.
                        lesson: >
                          Pass a support-set learnability gate before confirmation and add only a fixed degree-two geometry basis when a linear boundary cannot express the observed reward structure.
                        evidence: [H45, "docs/rl/133_l89_quadratic_feature_amendment_2026-07-18.md"]
                        children:
                          - id: N95
                            type: experiment
                            title: "L89 held-out-geometry contextual-bandit confirmation"
                            provenance: ai-executed
                            timestamp: "2026-07-18T10:35:00+08:00"
                            result: >
                              The quadratic LinUCB policy selected narrow for the unfitted hairpin and speed for the unfitted reverse-S. Across 40 independent pairs spanning four physics domains, it reduced time by 1.435 s with CI [-2.488, -0.365] and RMSE by 0.652 mm with CI [-1.394, -0.022], while all 80 episodes succeeded without collision.
                            evidence: [C64, H45, "results/research_platform/rl/l89_contextual_covariance_independent_eval_20260718_v1/summary.json", "docs/rl/134_l89_contextual_covariance_bandit_results_2026-07-18.md"]
                            children:
                              - id: N96
                                type: experiment
                                title: "Frozen-bandit inference cache remediation and full replay"
                                provenance: ai-executed
                                timestamp: "2026-07-18T11:10:00+08:00"
                                result: >
                                  Caching inverse and coefficient vectors reduced microbenchmark inference to about 14 microseconds. A second complete 80-episode run reproduced the control metrics exactly and changed paired planner mean compute by -0.175 ms with CI [-1.574, +1.081], removing the first run's +30.21 ms overhead.
                                evidence: [C64, H46, "results/research_platform/rl/l89_contextual_covariance_independent_eval_cached_20260718_v2/summary.json"]
  - id: N01
    type: question
    title: "Can bounded SAC correction safely improve a frozen BC sampling prior?"
    provenance: ai-suggested
    timestamp: "2026-07-14T18:00:00+08:00"
    description: >
      Test a narrow seen-scene gate before adding OOD, ICODE, memory or dynamic obstacles.
    children:
      - id: N02
        type: experiment
        title: "L17 v1 paired non-inferiority gate"
        provenance: ai-executed
        timestamp: "2026-07-14T18:30:00+08:00"
        result: >
          All three selectors retained step zero. The first 30301--30320 audit set showed exact BC fallback, but validation replay exposed a seed-contract mismatch.
        evidence: [C01, C02, "docs/rl/13_conservative_correction_preregistered_gate_2026-07-14.md"]
        children:
          - id: N03
            type: dead_end
            title: "Validation episode seed did not reset MPPI sampling"
            provenance: ai-executed
            timestamp: "2026-07-14T19:00:00+08:00"
            hypothesis: >
              A validation seed defined plant, sensors and planner randomness.
            failure_mode: >
              MppiPriorEnv reset plant and sensors but controller.reset reused the training-config seed.
            lesson: >
              Episode identity must be propagated explicitly to every stochastic subsystem.
            children:
              - id: N04
                type: experiment
                title: "L17 v2 episode-seeded MPPI rerun"
                provenance: ai-executed
                timestamp: "2026-07-14T20:00:00+08:00"
                result: >
                  MPPI reseeding worked, but trainer validation and standard evaluation still differed because initial-state distributions were not the same.
                evidence: [C03, "docs/rl/14_validation_seed_audit_and_l17_v2_prereg_2026-07-14.md"]
                children:
                  - id: N05
                    type: dead_end
                    title: "Training jitter leaked into validation"
                    provenance: ai-executed
                    timestamp: "2026-07-14T20:30:00+08:00"
                    hypothesis: >
                      Equal scene and seed implied equal initial conditions.
                    failure_mode: >
                      MppiPriorEnv applied rl.training.initial_state_noise during validation while ExperimentRunner used the exact benchmark start.
                    lesson: >
                      Training augmentation and validation initial-state distributions require separate explicit configuration.
                    children:
                      - id: N06
                        type: experiment
                        title: "L17 v3 corrected validation contract and sealed final test"
                        provenance: ai-executed
                        timestamp: "2026-07-14T22:00:00+08:00"
                        result: >
                          Trainer and evaluator matched. All three selectors retained step zero. Final seeds 40301--40320 yielded 54/60 success and 0/60 collision for both BC and selected; task rows were exactly paired.
                        evidence: [C01, C02, C03, C04, "docs/rl/15_l17_v3_conservative_correction_results_2026-07-14.md"]
                        children:
                          - id: N07
                            type: question
                            title: "Can twin-critic advantage identify harmful SAC corrections?"
                            provenance: ai-suggested
                            timestamp: "2026-07-15T10:00:00+08:00"
                            description: >
                              Diagnose whether online or target Q differences between the learned correction and its frozen BC action predict paired closed-loop benefit.
                            children:
                              - id: N08
                                type: experiment
                                title: "L18 online/target zero-threshold advantage gates"
                                provenance: ai-executed
                                timestamp: "2026-07-15T10:45:00+08:00"
                                result: >
                                  Three training seeds and 15 paired validation seeds produced 42/45 BC successes versus 36/45 for ungated, online-hard and target-hard correction; all conditions had zero collision. Gates accepted about 77% of steps but each lost seven BC-success episodes and gained only one. Data-quality checks passed over 49,786 control-step rows.
                                evidence: [C05, C06, "docs/rl/17_l18_critic_advantage_diagnostic_results_2026-07-15.md"]
                                children:
                                  - id: N09
                                    type: dead_end
                                    title: "Non-negative critic advantage as a deployment gate"
                                    provenance: ai-executed
                                    timestamp: "2026-07-15T10:50:00+08:00"
                                    hypothesis: >
                                      Requiring the smaller twin-critic action advantage to be non-negative would remove harmful corrections without collapsing to BC.
                                    failure_mode: >
                                      Online and target gates remained nondegenerate but did not improve pooled success and still lost seven paired BC-success episodes each.
                                    lesson: >
                                      Critic advantage is an imperfect ranking signal, not calibrated confidence; margin calibration or independent pessimistic critics require a separate experiment and data split.
                                    children:
                                      - id: N10
                                        type: question
                                        title: "Can a positive raw target-Q margin calibrate the correction gate?"
                                        provenance: ai-suggested
                                        timestamp: "2026-07-15T11:00:00+08:00"
                                        description: >
                                          Select one global margin on new calibration episodes while keeping a second set of selection episodes sealed.
                                        children:
                                          - id: N11
                                            type: experiment
                                            title: "L19 preregistered cross-seed target-Q margin calibration"
                                            provenance: ai-executed
                                            timestamp: "2026-07-15T11:35:00+08:00"
                                            result: >
                                              Three independent critics, 12 calibration seeds and six margins produced 252 episodes and 71,197 audited control-step rows. Margin 0.02 appeared best when pooled at 31/36 successes versus BC 29/36, but training seed 20260722 lost three paired BC successes and had negative mean return. Every margin failed the preregistered eligibility rule, so selection seeds remained unopened and the selector returned BC fallback.
                                            evidence: [C07, H05, "docs/rl/19_l19_advantage_margin_calibration_results_2026-07-15.md"]
                                            children:
                                              - id: N12
                                                type: dead_end
                                                title: "Single global raw-Q margin across independently trained critics"
                                                provenance: ai-executed
                                                timestamp: "2026-07-15T11:40:00+08:00"
                                                hypothesis: >
                                                  Increasing the same raw target-Q difference threshold would remove harmful corrections while preserving beneficial ones across training seeds.
                                                failure_mode: >
                                                  Pooled performance concealed model-specific regression, and no grid value preserved all paired BC successes across all critics.
                                                lesson: >
                                                  Raw critic differences are not a seed-invariant confidence scale; the next gate must normalize score scale or use an independently trained risk signal rather than scanning more raw margins.
                                                children:
                                                  - id: N13
                                                    type: question
                                                    title: "Can scale-invariant twin-critic consensus safely gate correction?"
                                                    provenance: ai-suggested
                                                    timestamp: "2026-07-15T11:45:00+08:00"
                                                    description: >
                                                      Penalize disagreement between the two target action advantages with a dimensionless beta while keeping the prior selection seeds sealed.
                                                    children:
                                                      - id: N14
                                                        type: experiment
                                                        title: "L20 preregistered twin-critic consensus-LCB calibration"
                                                        provenance: ai-executed
                                                        timestamp: "2026-07-15T12:00:00+08:00"
                                                        result: >
                                                          Three independent critics, 12 new calibration seeds and six betas produced 252 episodes and 70,081 audited control steps. Beta 2 improved success from BC 27/36 to 31/36, gained five successes, had positive mean paired return for every training seed and zero collision, but lost one paired BC success. No beta passed the fail-closed gate; selection seeds remained unopened and BC fallback was retained.
                                                        evidence: [C08, C09, H06, "docs/rl/21_l20_twin_critic_consensus_lcb_results_2026-07-15.md"]
                                                        children:
                                                          - id: N15
                                                            type: dead_end
                                                            title: "Self-gating with the actor's existing twin critics"
                                                            provenance: ai-executed
                                                            timestamp: "2026-07-15T12:03:00+08:00"
                                                            hypothesis: >
                                                              A scale-invariant disagreement penalty on the existing target critics would remove all harmful corrections while retaining beneficial corrections.
                                                            failure_mode: >
                                                              The best near-miss beta still accepted corrections in training seed 20260722 episode 20281201 and converted a BC success into failure, despite rescuing five other episodes.
                                                            lesson: >
                                                              Existing actor critics provide useful ranking information but are not an independent risk signal; the next gate should be trained or estimated independently from the actor optimization objective.
                                                            children:
                                                              - id: N16
                                                                type: question
                                                                title: "Can one-step counterfactual branches supply independent risk labels?"
                                                                provenance: ai-suggested
                                                                timestamp: "2026-07-15T12:10:00+08:00"
                                                                description: >
                                                                  Replay frozen-BC trajectories exactly, replace one accepted latent action with SAC correction, recover BC and compare paired 20-step outcomes without assigning full-episode failure to every step.
                                                                children:
                                                                  - id: N17
                                                                    type: experiment
                                                                    title: "L21 deterministic one-step counterfactual risk dataset"
                                                                    provenance: ai-executed
                                                                    timestamp: "2026-07-15T12:38:00+08:00"
                                                                    result: >
                                                                      Same-seed replay had zero observation error over all formal branches. Three checkpoints, ten train/validation episode seeds and six branch points produced 124 accepted samples with 101 train and 23 validation rows. All samples were neutral: train return deltas ranged from -0.0798 to +0.1043 and validation from -0.0360 to +0.1059, with zero collision, success or safety-override differences. Data quality passed but the preregistered class-coverage gate blocked model training; sealed test seeds remained unopened.
                                                                    evidence: [C10, C11, H07, "docs/rl/23_l21_counterfactual_risk_dataset_results_2026-07-15.md"]
                                                                    children:
                                                                      - id: N18
                                                                        type: dead_end
                                                                        title: "Isolated one-step intervention as the risk-learning unit"
                                                                        provenance: ai-executed
                                                                        timestamp: "2026-07-15T12:40:00+08:00"
                                                                        hypothesis: >
                                                                          One accepted correction step followed by BC recovery would generate both harmful and beneficial short-horizon examples for an independent risk estimator.
                                                                        failure_mode: >
                                                                          Frozen BC recovered the local perturbation; all 124 paired branches remained neutral and no class labels crossed the preregistered joint return/distance thresholds.
                                                                        lesson: >
                                                                          The observed L20 episode regression is produced by a sequence of accepted corrections, so the next counterfactual treatment should be a preregistered short correction burst rather than a post-hoc lower label threshold.
                                                                        children:
                                                                          - id: N19
                                                                            type: question
                                                                            title: "Can a preregistered ten-step gated correction burst supply risk labels?"
                                                                            provenance: ai-suggested
                                                                            timestamp: "2026-07-15T12:45:00+08:00"
                                                                            description: >
                                                                              Use prior L20 accepted-run lengths to freeze a ten-step intervention, then compare forty-step BC and gated-SAC branches on new episode-grouped development seeds.
                                                                            children:
                                                                              - id: N20
                                                                                type: experiment
                                                                                title: "L22 ten-step counterfactual burst dataset"
                                                                                provenance: ai-executed
                                                                                timestamp: "2026-07-15T13:05:00+08:00"
                                                                                result: >
                                                                                  Three checkpoints and ten new train/validation seeds produced 120 valid burst samples from 180 considered branch points. Replay error was zero and burst accounting passed. Train distance effects ranged from -8.0 to +18.5 cm and validation from -9.4 to +7.1 cm, but all rows remained neutral because return delta never reached the preregistered +/-0.5 joint threshold. Model training was blocked and sealed seeds stayed unopened.
                                                                                evidence: [C12, C13, C14, H08, H09, "docs/rl/25_l22_counterfactual_burst_results_2026-07-15.md"]
                                                                                children:
                                                                                  - id: N21
                                                                                    type: dead_end
                                                                                    title: "Forty-step joint-threshold classification for burst risk"
                                                                                    provenance: ai-executed
                                                                                    timestamp: "2026-07-15T13:08:00+08:00"
                                                                                    hypothesis: >
                                                                                      Ten-step accumulated corrections would create sufficient harmful and beneficial labels under the frozen L21 joint return/distance thresholds.
                                                                                    failure_mode: >
                                                                                      Return and distance were nearly redundant, with correlations 0.987 train and 0.996 validation, while the observed return range stayed inside -0.204 to +0.371. The return threshold therefore blocked every non-neutral label despite measurable positive and negative distance effects.
                                                                                    lesson: >
                                                                                      Do not relabel post hoc; align the next target with the actual macro-policy horizon and preserve continuous utility plus group-aware uncertainty.
                                                                                    children:
                                                                                      - id: N22
                                                                                        type: pivot
                                                                                        title: "Move from arbitrary three-class labels to sequence-level continuous utility"
                                                                                        provenance: ai-suggested
                                                                                        timestamp: "2026-07-15T13:10:00+08:00"
                                                                                        from: "One-step or short-burst harmful/neutral/beneficial classification using fixed joint thresholds"
                                                                                        to: "Preregistered macro-policy continuous utility estimation with independent episode groups and sealed testing"
                                                                                        trigger: "L22 exposed real context-dependent positive and negative effects but no valid class coverage; validation positive effects were also sparse across checkpoints."
                                                                                        children:
                                                                                          - id: N23
                                                                                            type: question
                                                                                            title: "Can frozen current-state features predict continuous burst utility safely?"
                                                                                            provenance: ai-suggested
                                                                                            timestamp: "2026-07-15T13:15:00+08:00"
                                                                                            description: >
                                                                                              Train a group-bootstrap neural ensemble on forty-step goal-distance improvement, calibrate a one-sided group-conformal lower bound, and keep all test seeds sealed unless a fixed development gate passes.
                                                                                            children:
                                                                                              - id: N24
                                                                                                type: experiment
                                                                                                title: "L23 grouped continuous-utility ensemble"
                                                                                                provenance: ai-executed
                                                                                                timestamp: "2026-07-15T13:50:00+08:00"
                                                                                                result: >
                                                                                                  Three actor checkpoints and 36 new development episode seeds produced 423 accepted branch rows in 108 independent checkpoint-episode groups. The corrected ensemble improved selection RMSE over a zero predictor by only 0.88%, achieved 56.67% balanced sign accuracy on effects of at least three centimetres, and accepted zero calibration samples after grouped conformal scaling. The development gate failed, so all 51 test groups and closed-loop selection seeds remained sealed and BC fallback was retained.
                                                                                                evidence: [C15, C16, C17, H10, H11, H12, "docs/rl/28_l23_continuous_utility_results_2026-07-15.md"]
                                                                                                children:
                                                                                                  - id: N25
                                                                                                    type: dead_end
                                                                                                    title: "State-only prediction of macro-policy utility"
                                                                                                    provenance: ai-executed
                                                                                                    timestamp: "2026-07-15T13:53:00+08:00"
                                                                                                    hypothesis: >
                                                                                                      The existing 67-dimensional state representation contains enough information to decide whether a future ten-step gated correction sequence will improve forty-step progress.
                                                                                                    failure_mode: >
                                                                                                      Predictive performance was approximately the zero baseline, meaningful negative effects were poorly classified, ensemble disagreement was under-dispersed, and the calibrated lower bound accepted no samples.
                                                                                                    lesson: >
                                                                                                      Future sequence utility depends on sampled candidate trajectories, future gate decisions and obstacle-relative geometry that are absent from a single pre-intervention state vector.
                                                                                                    children:
                                                                                                      - id: N26
                                                                                                        type: pivot
                                                                                                        title: "Compare candidate trajectories rather than infer them from one state"
                                                                                                        provenance: ai-suggested
