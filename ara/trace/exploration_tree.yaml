                                                                                                                                                                        title: "L65 sealed cross-plant residual-structure confirmation"
                                                                                                                                                                        provenance: ai-executed
                                                                                                                                                                        timestamp: "2026-07-16T20:25:00+08:00"
                                                                                                                                                                        result: >
                                                                                                                                                                          All 540 episodes on five untouched execution seeds completed. On shifted plants ICODE beat the parameter-matched MLP by 9.23%, or 0.004956 m with interval [0.003993, 0.005885] m; every physical domain and training block was positive, unseen and combined intervals were positive, every condition was 180/180 successful with zero collisions, and learned mean planning time remained below 50 ms.
                                                                                                                                                                        evidence: [C57, H42, "results/research_platform/rl/l65_residual_structure_cross_plant_confirmation_20260716_v1/residual_structure_cross_plant_summary.json", "docs/rl/95_l63_l65_cross_plant_residual_structure_results_2026-07-16.md", "ara/evidence/figures/fig07_l64_l65_cross_plant.md"]
