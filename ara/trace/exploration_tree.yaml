                                                                                      - id: N65
                                                                                        type: experiment
                                                                                        title: "L47 residual-only path tracking development gate"
                                                                                        provenance: ai-executed
                                                                                        timestamp: "2026-07-16T13:45:00+08:00"
                                                                                        result: >
                                                                                          Across 270 episodes, nominal and ICODE each achieved 90/90 successes and zero collisions, but ICODE worsened pooled cross-track RMSE by 2.2% and failed the preregistered tracking gate. Exploratory paired endpoints suggested shorter paths and lower control jerk, motivating an independent efficiency confirmation rather than relabeling the failed primary gate.
                                                                                        evidence: [C47, H34, "docs/rl/69_l47_delay_aligned_path_tracking_results_2026-07-16.md"]
                                                                                        children:
                                                                                          - id: N66
                                                                                            type: experiment
                                                                                            title: "L48 independent efficiency and smoothness confirmation"
                                                                                            provenance: ai-executed
                                                                                            timestamp: "2026-07-16T14:05:00+08:00"
                                                                                            result: >
                                                                                              The 360-episode confirmation failed its joint gate because path-length uncertainty crossed zero and only two of three model blocks had positive path-length means. Issued-control jerk reduction was 0.001230 with 95% CI [0.000264, 0.002215], and applied-control jerk reduction was 0.001234 with 95% CI [0.000567, 0.001945], independently confirming a smoothness endpoint without a global efficiency claim.
                                                                                            evidence: [C47, C48, "docs/rl/71_l48_efficiency_confirmation_results_2026-07-16.md"]
                                                                                            children:
                                                                                              - id: N67
                                                                                                type: experiment
                                                                                                title: "L49 task-specific path-data residual retraining"
                                                                                                provenance: ai-executed
                                                                                                timestamp: "2026-07-16T14:50:00+08:00"
                                                                                                result: >
                                                                                                  Three independently initialized H=36 ICODE models trained on applied-control path transitions passed the frozen offline gate. Across test and unseen splits, total rollout RMSE fell by 49.6-50.9%, position RMSE by 64.9-70.3% and heading RMSE by 69.1-73.7% relative to nominal.
                                                                                                evidence: [C46, C49, H33, H34, "results/research_platform/l49_icode_iterative_path_offline_gate_v1/summary.json"]
                                                                                                children:
                                                                                                  - id: N68
                                                                                                    type: experiment
                                                                                                    title: "L50 independent task-specific closed-loop confirmation"
                                                                                                    provenance: ai-executed
                                                                                                    timestamp: "2026-07-16T15:10:00+08:00"
                                                                                                    result: >
                                                                                                      All 360 planned episodes completed with zero protected-seed leakage, no collision increase and no success loss. The joint gate failed: path-length reduction was 0.01247 m with 95% CI [-0.01730, 0.04160], and issued jerk narrowly crossed zero. Applied jerk improved significantly overall. In the frozen long-delay stratum, issued jerk reduction was 0.001194 [0.000065, 0.002344] and applied jerk reduction was 0.001282 [0.000264, 0.002365], whereas matched-delay effects were indistinguishable from zero.
                                                                                                    evidence: [C48, C49, H35, "docs/rl/74_l49_l50_iterative_path_results_2026-07-16.md", "ara/evidence/tables/table06_l49_l50.md", "ara/evidence/figures/fig06_l49_l50.md"]
                                                                                                    children:
                                                                                                      - id: N69
                                                                                                        type: pivot
                                                                                                        title: "Gate residual authority from causal online reliability evidence"
                                                                                                        provenance: ai-suggested
