                                                                                                                                                type: experiment
                                                                                                                                                title: "L59 sealed independent high-dynamic confirmation"
                                                                                                                                                provenance: ai-executed
                                                                                                                                                timestamp: "2026-07-16T22:05:00+08:00"
                                                                                                                                                result: >
                                                                                                                                                  The predeclared ten confirmation seeds were opened only after the L58 gate. Across 240 episodes, ICODE reduced mean cross-track RMSE from 0.05758 m to 0.04117 m, a 27.06% reduction; the paired absolute-improvement 95% interval was [0.01385, 0.01877] m. All three blocks and all four scenes improved, including 34.26% on the unseen reverse-S path. Both methods were 120/120 successful with zero collisions, applied jerk fell 3.46%, and mean ICODE planning time remained below the frozen 50 ms bound.
