            type: dead_end
            title: "Unbounded low-authority HSS in the success-resolved development task"
            provenance: ai-executed
            timestamp: "2026-07-19T07:20:00+08:00"
            hypothesis: >
              The already confirmed 0/30/60% reliability mapping can remain unchanged through the terminal task phase and retain success at 300 steps.
            failure_mode: >
