                                                                                                                                                    title: "L60 parameter-matched MLP versus ICODE offline ablation"
                                                                                                                                                    provenance: ai-executed
                                                                                                                                                    timestamp: "2026-07-16T18:40:00+08:00"
                                                                                                                                                    result: >
                                                                                                                                                      Three 10,049-parameter direct MLP residuals were trained on the exact L56 hashes against 10,191-parameter ICODE models. Both structures passed nominal-relative eligibility, but the frozen offline structural hypothesis failed: MLP had 4.27% lower test and 2.24% lower unseen H=36 rollout RMSE than ICODE on average.
