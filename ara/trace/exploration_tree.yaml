                                                                                                                                type: dead_end
                                                                                                                                title: "Use wheel odometry as the state source for clean dynamics isolation"
                                                                                                                                provenance: ai-executed
                                                                                                                                timestamp: "2026-07-16T18:00:00+08:00"
                                                                                                                                hypothesis: >
                                                                                                                                  A clean obstacle-free path benchmark could isolate plant-model mismatch while retaining the default wheel-odometry measurement contract.
                                                                                                                                failure_mode: >
                                                                                                                                  Slip-biased wheel odometry dominated terminal tracking and made several feasible paths appear nonconvergent, confounding dynamics-model error with state-estimation error.
                                                                                                                                lesson: >
                                                                                                                                  Clean dynamics evidence should first use ground-truth MuJoCo pose and twist with zero sensor noise/latency, then introduce odometry and perception as separate orthogonal factors.
                                                                                                                                evidence: [H36, "docs/rl/81_l56_high_dynamic_benchmark_and_data_results_2026-07-16.md"]
