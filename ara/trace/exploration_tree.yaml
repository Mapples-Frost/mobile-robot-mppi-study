                                                                                  - id: N64
                                                                                    type: experiment
                                                                                    title: "L38-L46 horizon-matched ICODE qualification and model repair"
                                                                                    provenance: ai-executed
                                                                                    timestamp: "2026-07-16T13:20:00+08:00"
                                                                                    result: >
                                                                                      Support gating and unconstrained residual rollouts did not recover closed-loop tracking. Constraining the learned residual to dynamic states [v, omega], training on interval-average applied controls and modeling the known command delay repaired the H=36 prediction contract. All three L46 checkpoints improved total, position and heading RMSE on both test and unseen splits.
                                                                                    evidence: [C46, H33, H34, "docs/rl/67_l45_l46_offline_results_2026-07-16.md"]
