                                                                                                                                                                type: experiment
                                                                                                                                                                title: "L63 method-blind cross-plant calibration"
                                                                                                                                                                provenance: ai-executed
                                                                                                                                                                timestamp: "2026-07-16T19:25:00+08:00"
                                                                                                                                                                result: >
                                                                                                                                                                  Nominal-only calibration retained two failed attempts: v1 found torque, delay and combined shifts below resolution, while v2 made all single factors measurable but rejected an extreme combined plant with 50% success. The capped v3 attempt froze accepted single factors and selected a moderate combined domain; all selected domains were 100% successful with zero collisions and nominal cross-track shifts of 3.2% to 22.7%.
