                                                                                                                                                                                    timestamp: "2026-07-16T21:30:00+08:00"
                                                                                                                                                                                    result: >
                                                                                                                                                                                      All 360 scheduled artifacts were complete on five untouched seeds. Across the three primary observation domains ICODE beat matched MLP by 10.15%, or 0.005487 m with interval [0.004243, 0.006799] m; every primary domain and training block was positive, all primary conditions were 90/90 successful with zero collisions, and mean learned planning time stayed below 50 ms. The exploratory raw wheel-odometry success gain did not replicate: nominal, MLP and ICODE achieved 18/30, 13/30 and 12/30 successes respectively, refuting residual-only odometry correction.
