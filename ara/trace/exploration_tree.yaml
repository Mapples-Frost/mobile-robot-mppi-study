                                                                                                                                                                            title: "L66 method-blind observation-domain calibration"
                                                                                                                                                                            provenance: ai-executed
                                                                                                                                                                            timestamp: "2026-07-16T20:45:00+08:00"
                                                                                                                                                                            result: >
                                                                                                                                                                              Two nominal-only attempts completed 84 episodes. Frozen 100 ms latency and moderate noise-plus-latency domains were safe and measurable, but even stronger pure measurement noise changed nominal cross-track RMSE by only 1.61%, below the preregistered 3% resolution threshold. Pure noise was therefore removed as a standalone primary factor, while raw wheel odometry was retained only as a non-gating stress domain.
