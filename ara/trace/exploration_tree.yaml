                    evidence: [C81, H59, "results/research_platform/gate2_competence_gated_icode_l189/training_summary.json", "results/research_platform/rl/gate2_competence_gated_paired_l190/paired_comparison.json", "docs/rl/172_gate2_competence_gated_remediation_prereg_2026-07-18.md"]
