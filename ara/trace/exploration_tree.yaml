                                                                                                                                                                    provenance: ai-executed
                                                                                                                                                                    timestamp: "2026-07-16T19:48:00+08:00"
                                                                                                                                                                    result: >
                                                                                                                                                                      Across 324 episodes, ICODE beat MLP on every frozen physical domain. On the five shifted plants the direct improvement was 0.004754 m with hierarchical 95% lower bound 0.004000 m; both learned models improved nominal, unseen and combined-domain gates passed, and all methods preserved success and collision outcomes.
