                                                                                                                                            type: experiment
                                                                                                                                            title: "L58 new-seed residual-only closed-loop development gate"
                                                                                                                                            provenance: ai-executed
                                                                                                                                            timestamp: "2026-07-16T21:00:00+08:00"
                                                                                                                                            result: >
                                                                                                                                              Across 120 episodes, ICODE reduced mean cross-track RMSE from 0.06098 m to 0.04427 m, a 26.62% reduction with hierarchical-bootstrap absolute-improvement interval [0.01478, 0.01835] m. All three blocks and four scenes improved; both methods were 60/60 successful with zero collisions.
                                                                                                                                            evidence: [C53, "results/research_platform/rl/l58_icode_high_dynamic_closed_loop_20260716_v1/high_dynamic_closed_loop_summary.json", "docs/rl/83_l58_high_dynamic_icode_closed_loop_results_2026-07-16.md"]
