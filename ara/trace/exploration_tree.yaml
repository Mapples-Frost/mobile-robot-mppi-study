                                                                                                                                                        timestamp: "2026-07-16T19:00:00+08:00"
                                                                                                                                                        result: >
                                                                                                                                                          Across 180 paired episodes, MLP and ICODE reduced cross-track error by 22.39% and 30.13% relative to nominal. Despite its worse offline H=36 RMSE, ICODE beat MLP by 9.85%, with absolute-improvement interval [0.00330, 0.00583] m, positive effects in all three model blocks and on the unseen path, and no success or collision difference.
                                                                                                                                                        evidence: [C55, C56, H41, "results/research_platform/rl/l61_residual_structure_closed_loop_20260716_v1/residual_structure_closed_loop_summary.json", "docs/rl/88_l60_l61_residual_structure_results_2026-07-16.md"]
