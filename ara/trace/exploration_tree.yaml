            title: "L176 randomized multi-domain Gate 1 factorial"
            provenance: ai-executed
            timestamp: "2026-07-18T21:15:00+08:00"
            result: >
              All 72 randomized scene-domain-seed episodes completed with zero collisions. RL guidance produced the dominant closed-loop main effect. The ICODE plus RL simple combination improved success by one episode, reduced mean final distance by 0.0601 m and reduced control jerk by 0.00246 relative to RL alone, with the final-distance and jerk contrasts favorable in every one of the three independent seed clusters. The combination added about 45.7 ms mean planner time, all narrow-corridor cells still failed success, and the one-model-block, three-seed design remains developmental rather than confirmatory.
