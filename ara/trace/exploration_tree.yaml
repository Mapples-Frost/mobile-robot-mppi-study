                                                                                                                                        title: "L57 high-dynamic H=36 ICODE qualification"
                                                                                                                                        provenance: ai-executed
                                                                                                                                        timestamp: "2026-07-16T20:10:00+08:00"
                                                                                                                                        result: >
                                                                                                                                          Three independently initialized ICODE models passed the frozen all-window offline gate. Mean active-derivative RMSE fell by 25.08% on test and 28.41% on unseen data; H=36 rollout RMSE fell by 36.28% and 41.77%, with positive long-horizon effects in every model block.
                                                                                                                                        evidence: [C52, H38, "results/research_platform/l57_icode_high_dynamic_offline_gate_20260716_v1.json", "docs/rl/82_l57_high_dynamic_icode_offline_results_2026-07-16.md"]
                                                                                                                                        children:
