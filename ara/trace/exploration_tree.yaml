        type: dead_end
        title: "Pairwise value-ranked path-policy ICODE"
        provenance: ai-executed
        timestamp: "2026-07-19T20:20:00+08:00"
        hypothesis: >
          Preserving frozen-critic terminal-state ordering generalizes better than absolute-Q regression on held-out path routes.
        failure_mode: >
