    title: "Which two bidirectional ICODE-RL couplings should remain in the paper?"
    provenance: user
    timestamp: "2026-07-19T20:00:00+08:00"
    description: >
      The user required the original RL+ICODE direction to remain fixed while at least two coupling mechanisms were selected and tuned before reporting.
    also_depends_on: [N132, N138]
    children:
      - id: N140
        type: dead_end
        title: "Causal residual-conditioned SAC action correction"
        provenance: ai-executed
        timestamp: "2026-07-19T20:10:00+08:00"
        hypothesis: >
          ICODE residual and completed-transition innovation can condition a bounded SAC correction that improves both nominal and unseen-domain MPPI tracking.
        failure_mode: >
          L207 isolated proposal mean from covariance and improved unseen RMSE 5.56% but worsened nominal RMSE 16.15%. L209 innovation/support gating retained 100% success and zero collisions, yet worsened nominal RMSE 10.61%, improved unseen RMSE only 1.22%, and worsened unseen jerk 5.69%.
        lesson: >
          Causal context and safe fallback are necessary but insufficient; a high-dimensional free action correction is not sample-efficient enough for the present mainline.
