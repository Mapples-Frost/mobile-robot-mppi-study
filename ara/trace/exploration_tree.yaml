                                                                                                                                                            type: experiment
                                                                                                                                                            title: "L62 sealed residual-structure confirmation"
                                                                                                                                                            provenance: ai-executed
                                                                                                                                                            timestamp: "2026-07-16T19:16:00+08:00"
                                                                                                                                                            result: >
                                                                                                                                                              All 360 scheduled episodes completed on the ten predeclared sealed seeds. ICODE reduced cross-track RMSE by 26.83% versus nominal and by 10.17% versus the parameter-matched MLP; the direct ICODE-versus-MLP interval was [0.00355, 0.00564] m overall and [0.00408, 0.00726] m on the unseen reverse-S path. All three model blocks were positive, every condition was 120/120 successful with zero collisions, and both learned models passed the 50 ms mean-compute gate.
                                                                                                                                                            evidence: [C55, C56, H40, H41, "results/research_platform/rl/l62_residual_structure_confirmation_20260716_v1/residual_structure_closed_loop_summary.json", "docs/rl/90_l62_residual_structure_confirmation_results_2026-07-16.md"]
