  - id: N111
    type: dead_end
    title: "L174 dirty-worktree multi-domain Actor training"
    provenance: ai-executed
    timestamp: "2026-07-18T18:05:00+08:00"
    hypothesis: >
      A direct-control SAC Actor trained across scenes and bounded MuJoCo physics domains can provide a paper-faithful MPPI prior.
    failure_mode: >
      The run was started before the performance changes were committed, so its provenance metadata named an older source revision. Training was intentionally interrupted at 10,000 steps and the artifact was excluded from evidence.
    lesson: >
      Long research runs must begin from a committed source state whose SHA is recorded in the artifact; a numerically usable checkpoint is not admissible evidence when code provenance is ambiguous.
    evidence: [H58, "docs/rl/170_gate1_multidomain_factorial_results_2026-07-18.md"]
    children:
      - id: N112
        type: experiment
        title: "L175 multi-domain direct-control SAC Actor training"
        provenance: ai-executed
        timestamp: "2026-07-18T19:25:00+08:00"
        result: >
          A clean-SHA 60,000-step SAC run trained across four scenes and four bounded physics domains. The 40,000-step checkpoint was selected on a 30-episode validation matrix and achieved 29/30 success with zero collisions; its validation curve improved from 1/30 at 10,000 steps, demonstrating nontrivial learning rather than a fixed handcrafted controller.
        evidence: [C77, H58, "results/research_platform/rl/gate1_direct_control_multidomain_screen_l175/checkpoints/best.pt", "docs/rl/170_gate1_multidomain_factorial_results_2026-07-18.md"]
