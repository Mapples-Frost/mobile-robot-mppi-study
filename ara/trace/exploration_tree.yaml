  - id: N44
    type: pivot
    title: "Move from static/compute ablations to cross-layer dynamic attribution"
    also_depends_on: [N30, N32, N43]
    provenance: ai-suggested
    timestamp: "2026-07-15T20:30:00+08:00"
    from: "Static-obstacle scene-complexity and CPU micro-optimization studies"
    to: "A blocked ICODE--RL--Gate factorial with seen/unseen physics and a collidable dynamic crossing obstacle"
    trigger: "The main scientific program required direct attribution of residual prediction, learned sampling and gating under dynamics mismatch and moving obstacles."
    children:
      - id: N45
        type: experiment
        title: "L29 cross-layer ICODE--RL--Gate development factorial"
        provenance: ai-executed
        timestamp: "2026-07-15T20:55:00+08:00"
        result: >
          Three paired RL/ICODE training blocks, five matched development seeds, three scenes, two physics domains and six methods produced all 540 planned episodes. Integrity, protected-seed, collision and 7806-step exact-clean-fallback checks passed. The spatial gate improved static success but collided in 24/30 episodes per residual mode during lateral dynamic crossing; the fixed efficacy gate failed and confirmation stayed sealed.
        evidence: [C31, C32, H24, "docs/rl/39_l29_cross_layer_factorial_prereg_2026-07-15.md", "results/research_platform/rl/l29_cross_layer_development_multiblock_20260715_v1/development_gate.json"]
        children:
          - id: N46
            type: dead_end
            title: "Purely spatial complexity as a sufficient dynamic-crossing gate"
            provenance: ai-executed
            timestamp: "2026-07-15T21:00:00+08:00"
            hypothesis: >
              Front proximity, bilateral constriction and obstacle density would activate the RL prior early enough for a sparse obstacle crossing laterally.
            failure_mode: >
              A one-sided crossing remained deliberately suppressed as wall-like geometry; average gate alpha stayed near 0.05 and the spatial-gated methods collided in 12/15 episodes in each dynamic physics stratum.
            lesson: >
              Moving sparse hazards require scan-temporal closing information or explicit tracking; static spatial density alone cannot distinguish a benign side wall from an approaching lateral obstacle.
            children:
              - id: N47
                type: experiment
                title: "L30 scan-temporal closing-risk remediation"
                provenance: ai-executed
                timestamp: "2026-07-15T21:20:00+08:00"
                result: >
                  A single preregistered scan-only temporal-risk rule was tested in 180 new development episodes and compared with the frozen 540 L29 episodes. Temporal-gate plus ICODE achieved 60/60 blocking-scene successes, 0/60 collisions and 0.289 m mean final distance, while retaining exact traditional-MPPI fallback over 7806 clean steps. The formal L30 gate still failed because the temporal-gate nominal ablation had one seen-dynamic collision above its matched always-RL comparator; no confirmation seed was opened.
                evidence: [C31, C33, C34, H24, H25, "docs/rl/41_l29_l30_cross_layer_results_2026-07-15.md", "results/research_platform/rl/l30_temporal_gate_development_multiblock_20260715_v1/development_gate.json"]
                children:
                  - id: N48
                    type: question
                    title: "Does the primary temporal-gate + ICODE method generalize across dynamic-obstacle variants?"
                    provenance: ai-suggested
                    timestamp: "2026-07-15T21:25:00+08:00"
                    description: >
                      Freeze the primary deployment candidate, vary crossing direction, phase, speed and size on new development seeds, and open a new confirmation set only after a primary-method safety and non-inferiority gate passes.
                    children:
                      - id: N49
                        type: experiment
                        title: "L31 dynamic-motion generalization stress test"
                        provenance: ai-executed
                        timestamp: "2026-07-15T22:08:00+08:00"
                        result: >
                          A preregistered randomized complete-block design crossed three independent RL/ICODE checkpoint pairs, five fresh episode seeds, four obstacle-motion variants, two physics domains and five methods for all 600 planned MuJoCo episodes. Integrity, checkpoint, finite-metric and protected-seed checks passed. Temporal-gate + ICODE achieved only 64/120 successes with 56/120 collisions: reverse-direction cells had 1/15 success in each physics domain and fast cells had 2/15 and 5/15. Only one of five efficacy checks passed and the hard zero-collision check failed, so confirmation remained sealed.
                        evidence: [C35, C36, C37, H26, H27, "docs/rl/43_l31_dynamic_variant_generalization_results_2026-07-15.md", "ara/evidence/tables/table01_l31_dynamic_variant.md", "ara/evidence/figures/fig01_l31_dynamic_variant.md"]
                        children:
                          - id: N50
                            type: dead_end
                            title: "Use scalar sector closing risk as direct RL-prior confidence"
                            provenance: ai-executed
                            timestamp: "2026-07-15T22:10:00+08:00"
                            hypothesis: >
                              Taking the maximum of spatial complexity and a scan-sector closing activation would generalize the successful L30 behavior to new crossing directions, speeds, phases and sizes.
                            failure_mode: >
                              All 56 primary collisions occurred with gate alpha one. Reverse crossings produced nonphysical pre-collision closing-rate means of 29--32 m/s from sector-minimum reassociation, while fast crossings produced plausible closing rates but activated an RL policy trained mainly on static observations that could not infer motion direction from one scan.
                            lesson: >
                              Hazard intensity and controller competence are different quantities. A temporal hazard cannot be converted directly into greater trust in an RL prior, and single-frame scan features cannot identify dynamic direction.
                            children:
                              - id: N51
                                type: pivot
                                title: "Separate temporal hazard observability from policy competence"
                                provenance: ai-suggested
                                timestamp: "2026-07-15T22:12:00+08:00"
                                from: "Risk-triggered activation of a static-scene single-scan RL prior"
                                to: "Robust scan-flow or scan-history features, dynamic-domain RL training, and a competence confidence distinct from the shared dynamic safety layer"
                                trigger: "L31 refuted both the physical validity of sector-minimum velocity and the assumption that high dynamic risk implies high RL competence."
                                children:
                                  - id: N52
                                    type: experiment
                                    title: "L32 robust scan-flow, shared safety and competence-separation factorial"
                                    provenance: ai-executed
                                    timestamp: "2026-07-16T00:15:00+08:00"
                                    result: >
                                      A corrected 720-episode development factorial crossed three RL/ICODE model blocks, four motion variants, two physics domains, five fresh seeds and six methods. Multi-beam robust scan-flow bounded the maximum observed closing rate at 0.891 m/s, while shared temporal safety improved traditional ICODE from 32/120 to 76/120 successes and reduced collisions from 88/120 to 44/120. The primary competence-gated learned condition reached only 57/120 successes with 63/120 collisions, so the preregistered gate failed and no sealed seed was opened.
                                    evidence: [C38, C39, H28, "docs/rl/46_l32_temporal_safety_remediation_results_2026-07-16.md"]
                                    children:
                                      - id: N53
                                        type: dead_end
                                        title: "Treat reactive temporal safety and confidence separation as a complete dynamic-policy remedy"
                                        provenance: ai-executed
                                        timestamp: "2026-07-16T00:18:00+08:00"
                                        hypothesis: >
                                          Correcting scan-flow validity, adding a common TTC-style safety layer and separating competence confidence would be sufficient for the existing static-trained RL prior to handle all dynamic variants.
                                        failure_mode: >
                                          Shared safety strongly helped traditional MPPI but robust learned conditions remained direction dependent; competence separation had a favorable point direction but its paired interval crossed zero, and fast/large motion cells still collided frequently.
                                        lesson: >
                                          A reactive layer can constrain longitudinal risk but cannot substitute for a policy that observes temporal direction and was trained on dynamic closed-loop data.
                                        children:
                                          - id: N54
                                            type: experiment
                                            title: "L33 three-frame dynamic training with full learned-prior authority"
                                            provenance: ai-executed
                                            timestamp: "2026-07-16T00:35:00+08:00"
                                            result: >
                                              SAC used three LaserScan frames, four randomized motion families and four seen MuJoCo physics domains for 30k steps, with model selection on two held-out motion paths in a combined-unseen domain. All trained checkpoints had 0/6 held-out success, the best trained checkpoint ended 3.701 m from the goal, and 87 training episodes produced no successful episode. The initialized checkpoint remained best.
                                            evidence: [C40, "docs/rl/49_l33_l34_dynamic_bounded_correction_results_2026-07-16.md"]
                                            children:
                                              - id: N55
                                                type: pivot
                                                title: "Bound RL to a correction around the traditional MPPI prior"
                                                provenance: ai-suggested
                                                timestamp: "2026-07-16T00:37:00+08:00"
                                                from: "RL local-subgoal output completely replacing the trusted sampling prior"
                                                to: "A fixed 25% learned correction around GoalWarmStart with the same temporal observation, reward and randomized training domains"
                                                trigger: "L33 lost all successful closed-loop data and learned collision avoidance by moving away from the goal, indicating destructive learned-prior authority rather than missing temporal input alone."
                                                children:
                                                  - id: N56
                                                    type: experiment
                                                    title: "L34 bounded dynamic correction across three independent training seeds"
                                                    provenance: ai-executed
                                                    timestamp: "2026-07-16T10:05:00+08:00"
                                                    result: >
                                                      Three independent 30k SAC runs each improved against its own fixed-seed step-zero reference. Across 18 paired held-out episodes, success increased from 4/18 to 10/18, collision decreased from 12/18 to 7/18, there were six success gains with zero losses and five collision improvements with zero regressions, and mean final distance improved by 0.547 m. All three seed audits had 42/42 validation rows, finite metrics and complete checkpoints; the preregistered multiseed development gate passed.
                                                    evidence: [C41, H29, H30, "docs/rl/49_l33_l34_dynamic_bounded_correction_results_2026-07-16.md", "ara/evidence/tables/table02_l34_dynamic_multiseed.md", "ara/evidence/figures/fig02_l34_dynamic_multiseed.md"]
                                                    children:
                                                      - id: N57
                                                        type: experiment
                                                        title: "L35 independent confirmation of L34 bounded correction"
                                                        provenance: ai-executed
                                                        timestamp: "2026-07-16T10:30:00+08:00"
                                                        result: >
                                                          Sixty independently seeded episodes formed thirty initial-versus-best checkpoint pairs across three training seeds and two held-out motion paths. Artifact integrity passed, but success changed from 13/30 to 12/30, collision stayed 15/30, mean final-distance improvement was only 0.005 m, and only one of three training seeds had a positive success change. The hierarchical-bootstrap success difference was -0.033 with 95% CI [-0.233, 0.167], so the preregistered confirmation gate failed.
                                                        evidence: [C42, "docs/rl/51_l35_independent_confirmation_results_2026-07-16.md", "ara/evidence/tables/table03_l35_independent_confirmation.md", "ara/evidence/figures/fig03_l35_independent_confirmation.md"]
                                                        children:
                                                          - id: N58
                                                            type: dead_end
                                                            title: "Treat L34 model-selection gains as independently generalizing bounded-RL evidence"
                                                            provenance: ai-executed
                                                            timestamp: "2026-07-16T10:32:00+08:00"
                                                            hypothesis: >
                                                              The three L34 best checkpoints would retain positive success and noninferior collision performance on new episode seeds under the same held-out paths and combined-unseen physics domain.
                                                            failure_mode: >
                                                              The pooled success effect reversed slightly, two training seeds were nonpositive, and the confidence intervals included both material benefit and harm. Scene diagnostics also showed complete outcome saturation: every diagonal-path episode collided while offset-path episodes never collided.
                                                            lesson: >
                                                              Checkpoint-selection cells cannot establish generalization, and benchmark scenes must contain within-scene outcome variation before they can identify policy effects.
                                                            children:
                                                              - id: N59
                                                                type: experiment
                                                                title: "L36 traditional-only dynamic benchmark calibration"
                                                                provenance: ai-executed
                                                                timestamp: "2026-07-16T10:40:00+08:00"
                                                                result: >
                                                                  Traditional GoalWarmStart MPPI alone evaluated eight candidate moving-obstacle geometries over eight new seeds, producing 64 complete episodes without inspecting RL or ICODE outcomes. Five candidates were eligible, and the fixed selector chose easy oblique_mid (5/8 success, 2/8 collision), moderate anti_diag_small (1/8, 4/8) and hard oblique_steep (1/8, 5/8). The selected collision-rate span was 0.375, so the identifiability gate passed.
                                                                evidence: [C43, H31, "docs/rl/53_l36_dynamic_benchmark_calibration_results_2026-07-16.md", "ara/evidence/tables/table04_l36_dynamic_calibration.md", "ara/evidence/figures/fig04_l36_dynamic_calibration.md"]
                                                                children:
                                                                  - id: N60
                                                                    type: question
                                                                    title: "Do bounded RL and ICODE provide complementary closed-loop benefit?"
                                                                    provenance: ai-suggested
                                                                    timestamp: "2026-07-16T10:42:00+08:00"
                                                                    description: >
                                                                      On calibrated moving-obstacle scenes, use a paired two-by-two factorial to separate the bounded-RL main effect, ICODE main effect and their interaction while preserving common random numbers, shared safety and sealed-seed protection.
                                                                    children:
                                                                      - id: N61
                                                                        type: experiment
                                                                        title: "L37 bounded-RL by ICODE paired factorial"
                                                                        provenance: ai-executed
                                                                        timestamp: "2026-07-16T10:52:00+08:00"
                                                                        result: >
                                                                          All 180 planned episodes completed across three model blocks, three calibrated scenes, five fresh seeds and four conditions, with no protected or sealed seed leakage. Traditional nominal achieved 15/45 success and 21/45 collisions; bounded-RL plus ICODE achieved 8/45 success and 34/45 collisions. The combined method lost seven net successes, added thirteen collisions and worsened mean final distance by 0.542 m. Both main effects were unfavorable, although the success difference-in-differences interaction was +0.222 with 95% CI [0.022, 0.422]. The fixed gate failed in all three model blocks.
                                                                        evidence: [C44, C45, H32, "docs/rl/55_l37_bounded_rl_icode_factorial_results_2026-07-16.md", "ara/evidence/tables/table05_l37_factorial.md", "ara/evidence/figures/fig05_l37_factorial.md"]
                                                                        children:
                                                                          - id: N62
                                                                            type: dead_end
                                                                            title: "Directly combine the current L34 bounded-RL and offline-accurate ICODE checkpoints"
                                                                            provenance: ai-executed
                                                                            timestamp: "2026-07-16T10:54:00+08:00"
                                                                            hypothesis: >
                                                                              The current bounded-RL checkpoints and ICODE checkpoints would each improve dynamic closed-loop control and provide an additional positive cross-layer interaction.
                                                                            failure_mode: >
                                                                              Bounded RL and ICODE each worsened the primary closed-loop metrics; the combined controller was worse than traditional nominal despite a positive statistical interaction. ICODE's offline H=20 prediction advantage did not transfer to the 36-step MPPI optimization horizon.
                                                                            lesson: >
                                                                              A positive interaction is not an absolute performance win. Residual models require horizon-matched rollout, cost-ranking and traditional-MPPI closed-loop eligibility before recombination with RL.
                                                                            children:
                                                                              - id: N63
                                                                                type: pivot
                                                                                title: "Qualify ICODE independently before reopening cross-layer combination"
                                                                                provenance: ai-suggested
                                                                                timestamp: "2026-07-16T10:55:00+08:00"
                                                                                from: "Direct RL and ICODE composition after offline residual validation"
                                                                                to: "On-policy residual data, H=36 rollout and MPPI cost-ranking validation, then a residual-only closed-loop gate before any renewed RL factorial"
                                                                                trigger: "L37 showed negative bounded-RL and ICODE main effects and a worse combined controller on calibrated development scenes, despite valid artifacts and improved offline residual RMSE."
