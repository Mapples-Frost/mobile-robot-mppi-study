                                                                                                                                    type: experiment
                                                                                                                                    title: "L56 frozen high-dynamic dataset qualification"
                                                                                                                                    provenance: ai-executed
                                                                                                                                    timestamp: "2026-07-16T19:10:00+08:00"
                                                                                                                                    result: >
                                                                                                                                      The fixed 13 kg low-friction, torque-limited, 40 ms delay plant completed all 48 collection episodes and produced 12,074 transitions. All four path families passed excitation, success, safety and saturation gates; episode-wise train, validation, test and unseen splits were frozen with SHA-256 provenance.
                                                                                                                                    evidence: [C52, H36, H38, "results/research_platform/rl/l56_icode_high_dynamic_data_20260716_v1/high_dynamic_data_gate_summary.json", "docs/rl/81_l56_high_dynamic_benchmark_and_data_results_2026-07-16.md"]
