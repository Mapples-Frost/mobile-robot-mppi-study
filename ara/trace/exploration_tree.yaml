                                                                                                                                                                                result: >
                                                                                                                                                                                  All 216 episodes completed. Across clean, 100 ms latency and combined noise-plus-latency domains, ICODE beat matched MLP by 9.50%, or 0.005226 m with hierarchical 95% lower bound 0.004038 m; every primary domain and model block was positive, and all primary conditions preserved success and zero collisions. Raw wheel-odometry success improved in development but remained explicitly exploratory.
