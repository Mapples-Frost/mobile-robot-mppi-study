actor_checkpoint: results/research_platform/rl/gate1_direct_control_multidomain_screen_l175/checkpoints/best.pt
seed: 20260718

# Small, bounded perturbations retain task-specific Actor coverage without
# relabelling arbitrary random driving as on-policy data.
action_noise_std: 0.03
random_action_probability: 0.05

splits:
  train:
    source: training
    roles: [seen]
    episodes_per_environment: 1
    max_steps: 180
    seed_base: 22771000
  validation:
    source: validation
    roles: [seen]
    episodes_per_environment: 1
    max_steps: 180
    seed_base: 22772000
  test:
    source: validation
    roles: [seen]
    episodes_per_environment: 1
    max_steps: 180
    seed_base: 22773000
  unseen:
    source: validation
    roles: [unseen]
    episodes_per_environment: 2
    max_steps: 180
    seed_base: 22774000
