# Unified A-E clean-dynamics MPPI benchmark.  It intentionally isolates model
# mismatch from LaserScan, obstacle representation, Memory, and safety control.
schema_version: 1
base_config: configs/icode/oracle_ablation.yaml

run:
  name: residual_mppi_benchmark
  seeds: [101, 211, 307, 401, 503, 601, 701, 809, 907, 1009]
  smoke_seeds: [11, 23, 37, 41, 53]
  output_dir: results/icode/control/residual_benchmark

methods:
  - nominal_no_mismatch
  - nominal_mismatch
  - oracle_residual
  - mlp_residual
  - icode_residual

sample_efficiency:
  formal_num_samples: [50, 100, 200, 400]
  smoke_num_samples: [12]

smoke:
  horizon: 8
  max_steps: 35

event_metrics:
  stuck_displacement_threshold: 0.004
  spin_displacement_threshold: 0.010
  spin_yaw_rate_threshold: 0.80

scenarios:
  active: clean_dynamics
  retained_mujoco_scenarios:
    - simple
    - lab_complex
    - narrow_corridor
    - u_trap_long_board
  note: >-
    The four MuJoCo scenes remain in the protected live-simulation pipeline.
    This benchmark deliberately contains no obstacles so dynamics-model error
    is not confounded with perception or safety arbitration.

memory_enabled: false
goal: [3.0, 3.0]
