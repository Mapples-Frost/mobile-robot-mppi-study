scope: evaluation_only_reference_revision_synchronization
development_only: true
amends:
  - configs/research/complex_maneuver_proposal_execution_equivalence_amendment_v1.yaml

question: >-
  Can the evaluation monitor survive a standard static A* route replacement
  without changing planner behavior or carrying progress from an obsolete
  route into the replacement geometry?

evidence_anchor:
  failure_commit: 0e34633
  failure_tag: checkpoint/complex-maneuver-actor-on-reference-tracking-fail-20260728
  failure_path: research_artifacts/complex_maneuver_proposal_execution_consistency_v1/actor_on_equivalence_amended/reference_af691f1_failure.json
  failure_sha256: da0c7569588fa6cc2d9bff3951c7e49fe0d5d17504fe0f856038bb825fe989ff
  exception: "ValueError: minimum polyline progress is outside the route"
  complete_episode_produced: false

root_cause_contract:
  route_mutation: PolylineReference.replace_points
  route_mutation_resets_reference_progress: true
  monitor_state_that_remained_stale:
    - progress
    - obstacle_progress
    - next_obstacle
    - recovery_start_time
    - recovery_start_progress
  forbidden_workaround: clamp_stale_progress_to_new_route_end
  rationale: >-
    Clamping would avoid the exception but would falsely label the robot as
    already near the end of a newly generated route.

intervention:
  polyline_reference:
    add_private_revision_counter: true
    initial_revision: 0
    increment_only_after_successful_replace_points: true
    expose_read_only_revision_property: true
    reset_does_not_change_revision: true
    projection_and_target_semantics_changed: false
  tracking_event_monitor:
    store_last_seen_revision: true
    check_revision_before_every_update: true
    on_revision_change:
      progress: 0.0
      recompute_obstacle_progress_on_new_route: true
      next_obstacle: 0
      recovery_start_time: null
      recovery_start_progress: null
      center_crossing_count: preserve
      inside_center_crossing: preserve
      update_last_seen_revision: true
    reason_to_preserve_center_crossing_state: >-
      It is an episode-level event count defined in world coordinates, not a
      route-relative state variable.

