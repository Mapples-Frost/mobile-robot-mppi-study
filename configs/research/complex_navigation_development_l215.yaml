final_benchmark:
  status: development
  preregistration: docs/rl/215_complex_navigation_development_protocol_2026-07-19.md
  base_config: configs/research/mujoco_strong_mppi_baseline.yaml
  metric_profile: point_goal

  actor_checkpoint: results/research_platform/rl/gate1_direct_control_multidomain_screen_l175/checkpoints/best.pt
  ordinary_checkpoints:
    - results/research_platform/l57_icode_high_dynamic_h36_seed20261201_v1/best.pt
    - results/research_platform/l57_icode_high_dynamic_h36_seed20261202_v1/best.pt
    - results/research_platform/l57_icode_high_dynamic_h36_seed20261203_v1/best.pt
  value_checkpoints:
    - results/research_platform/gate3_value_aligned_ensemble_member1_l192/best.pt
    - results/research_platform/gate3_value_aligned_ensemble_member2_l192/best.pt
    - results/research_platform/gate3_value_aligned_ensemble_member3_l192/best.pt
  ordinary_calibration_summary: results/research_platform/rl/gate4_ordinary_reliability_calibration_l203/calibration_summary.json
  ordinary_calibration_config: configs/rl/gate4_ordinary_reliability_calibration_l203.yaml
  ordinary_calibration_gate_evidence: results/research_platform/rl/gate4_ordinary_reliability_stress_evaluation_l214/stress_summary.json
  value_calibration_summary: results/research_platform/rl/gate3_reliability_calibration_l193/calibration_summary.json
  value_calibration_config: configs/rl/gate3_reliability_calibration_l193.yaml
  value_calibration_gate_evidence: results/research_platform/rl/gate3_reliability_stress_evaluation_l194/stress_summary.json

  physics_domain_config: configs/research/mujoco_physics_domains.yaml
  physics_domains:
    - nominal_seen
    - combined_unseen
  scene_configs:
    - configs/research/mujoco_lab_complex.yaml
    - configs/research/mujoco_narrow_corridor.yaml
    - configs/research/mujoco_u_trap_long_board.yaml

  total_rollouts: 100
  iterations: 2
  max_steps: 600
  terminal_guidance_radius: 0.0
  terminal_guided_fraction_floor: 0.0
  completion_handover_full_fallback_distance: 0.40
  completion_handover_full_rl_distance: 0.80
  planner_overrides:
    terminal_control_radius: 0.80
    terminal_translation_speed_limit: 0.12
    terminal_translation_heading_gate_rad: 0.40
    terminal_alignment_yaw_gain: 0.80
  # The primary benchmark isolates learned dynamics and navigation.  Global
  # localization error is a separate stress factor; mixing raw wheel-dead-
  # reckoning drift into truth-referenced success would confound this Gate.
  sensor_overrides:
    pose_source: ground_truth
    twist_source: ground_truth
  schedule_seed: 20260723
  development_seeds:
    - 48
    - 49
    - 50
