include: mujoco_v3_probabilistic_crossing_smoke_amendment17.yaml

experiment:
  name: mujoco_complex_static_three_dynamic_v1
  seed: 780500001
  max_steps: 900
  initial_state: [-4.6, -2.5, 0.0, 0.0, 0.0]
  terminate_on_collision: true

action_space:
  upper: [0.6, 0.9]

task:
  type: polyline
  position: [4.45, 2.5]
  position_tolerance: 0.30
  lookahead_distance: 1.4
  terminal_approach_distance: 1.1
  points:
    - [-4.6, -2.5]
    - [-3.45, -2.5]
    - [-3.45, 1.05]
    - [-2.2, 1.05]
    - [-1.45, 0.70]
    - [-1.45, -1.60]
    - [0.0, -1.60]
    - [0.55, -0.90]
    - [0.55, 1.15]
    - [2.0, 1.15]
    - [2.5, 0.40]
    - [2.5, -1.20]
    - [3.9, -1.20]
    - [4.45, -0.20]
    - [4.45, 2.50]
  corridor_half_width: 0.85
  footprint_radius: 0.25
  terminate_on_boundary_violation: true
  projection_backtrack_distance: 1.0
  projection_forward_distance: 2.4

scene:
  name: four_gate_s_maze_three_uncertain_crossings
  obstacles:
    # Arena boundary.
    - {type: box, position: [0.0, -3.35], size: [5.20, 0.15], height: 0.45, rgba: [0.25, 0.27, 0.31, 1.0]}
    - {type: box, position: [0.0, 3.35], size: [5.20, 0.15], height: 0.45, rgba: [0.25, 0.27, 0.31, 1.0]}
    - {type: box, position: [-5.15, 0.0], size: [0.15, 3.50], height: 0.45, rgba: [0.25, 0.27, 0.31, 1.0]}
    - {type: box, position: [5.15, 0.0], size: [0.15, 3.50], height: 0.45, rgba: [0.25, 0.27, 0.31, 1.0]}

    # Alternating gates force a genuine S-shaped global route.
    - {type: box, position: [-2.70, -1.40], size: [0.12, 1.80], height: 0.50, rgba: [0.38, 0.41, 0.46, 1.0]}
    - {type: box, position: [-0.70, 1.40], size: [0.12, 1.80], height: 0.50, rgba: [0.38, 0.41, 0.46, 1.0]}
    - {type: box, position: [1.30, -1.35], size: [0.12, 1.85], height: 0.50, rgba: [0.38, 0.41, 0.46, 1.0]}
    - {type: box, position: [3.20, 1.45], size: [0.12, 1.75], height: 0.50, rgba: [0.38, 0.41, 0.46, 1.0]}

    # Static clutter prevents a trivial wide-radius shortcut through each room.
    - {type: cylinder, position: [-4.15, 1.95], radius: 0.28, height: 0.52, rgba: [0.45, 0.48, 0.40, 1.0]}
    - {type: cylinder, position: [-1.65, 2.25], radius: 0.26, height: 0.52, rgba: [0.45, 0.48, 0.40, 1.0]}
    - {type: cylinder, position: [0.15, -2.45], radius: 0.27, height: 0.52, rgba: [0.45, 0.48, 0.40, 1.0]}
    - {type: cylinder, position: [2.15, 2.35], radius: 0.30, height: 0.52, rgba: [0.45, 0.48, 0.40, 1.0]}
    - {type: cylinder, position: [4.10, -2.25], radius: 0.26, height: 0.52, rgba: [0.45, 0.48, 0.40, 1.0]}

    # Dynamic 1: vertical upper-gate crossing.
    - type: cylinder
      position: [-2.70, 0.82]
      radius: 0.25
      height: 0.58
      rgba: [0.95, 0.32, 0.18, 1.0]
      motion:
        type: linear_ping_pong
        start: [-2.70, 0.82]
        end: [-2.70, 2.84]
        period_s: 25.0
        phase_s: 1.2
        phase_jitter_s: 0.55
        period_scale_range: [0.90, 1.10]
        endpoint_jitter_m: 0.06

    # Dynamic 2: diagonal lower-gate crossing.
    - type: cylinder
      position: [-1.40, -2.60]
      radius: 0.25
      height: 0.58
      rgba: [0.95, 0.75, 0.15, 1.0]
      motion:
        type: linear_ping_pong
        start: [-1.40, -2.60]
        end: [0.0, -0.75]
        period_s: 18.5
        phase_s: 4.0
        phase_jitter_s: 0.65
        period_scale_range: [0.90, 1.10]
        endpoint_jitter_m: 0.06

    # Dynamic 3: vertical final-gate crossing.
    - type: cylinder
      position: [3.20, -2.75]
      radius: 0.25
      height: 0.58
      rgba: [0.76, 0.22, 0.82, 1.0]
      motion:
        type: linear_ping_pong
        start: [3.20, -2.75]
        end: [3.20, -0.68]
        period_s: 24.0
        phase_s: 6.1
        phase_jitter_s: 0.70
        period_scale_range: [0.90, 1.10]
        endpoint_jitter_m: 0.06

perception:
  dynamic_obstacle_tracker:
    maximum_tracks: 3

complex_scene_design:
  schema_version: 1
  scene_role: complex_static_plus_three_dynamic
  static_obstacle_count: 13
  dynamic_obstacle_count: 3
  route_shape: four_gate_s_maze
  nominal_reference_length_m: 22.6605309985
  route_conflict_points:
    - [-2.70, 1.05]
    - [-0.70, -1.60]
    - [3.20, -1.20]
  controller_observation: causal_laser_scan_only
  simulator_future_truth_used_by_controller: false
  obstacle_identity_exposed_to_controller: false
  motion_uncertainty:
    phase_jitter: true
    period_scale_randomization: true
    endpoint_jitter: true
    sampled_once_per_episode: true
  total_rollouts_per_decision: 600
  development_only: true

complex_scene_feasibility_contract:
  robot_footprint_radius_m: 0.25
  static_clearance_margin_m: 0.08
  dynamic_route_intersection_tolerance_m: 0.01
  dynamic_path_static_clearance_floor_m: 0.05
  certified_crossing_width_m: 1.40
  maximum_robot_speed_mps: 0.60
  actuator_margin_s: 0.35
  minimum_required_free_gap_s: 2.683333333333333
  worst_period_scale: 0.90
  endpoint_jitter_m: 0.06
