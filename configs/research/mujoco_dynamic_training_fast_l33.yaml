include: mujoco_strong_mppi_baseline.yaml

experiment:
  name: dynamic_training_fast_l33

scene:
  name: dynamic_training_fast_l33
  obstacles:
    - type: cylinder
      position: [2.10, 0.90]
      radius: 0.20
      height: 0.50
      motion:
        type: linear_ping_pong
        start: [2.10, 0.90]
        end: [0.90, 2.10]
        period_s: 10.0
        phase_s: 1.5
        phase_jitter_s: 5.0
        period_scale_range: [0.80, 1.20]
        endpoint_jitter_m: 0.10

