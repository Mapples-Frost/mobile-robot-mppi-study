include: mujoco_clean_dynamics.yaml

experiment:
  name: mujoco_physics_domain_collection

physics_domains:
  episodes_per_domain: 12
  steps_per_episode: 100
  source: mixed
  validation_fraction: 0.15
  test_fraction: 0.15
  domains:
    - name: nominal_seen
      role: seen
      plant_override: {}

    - name: high_mass_seen
      role: seen
      plant_override:
        robot:
          chassis_mass: 11.0
          chassis_inertia: [0.10, 0.15, 0.20]

    - name: low_friction_seen
      role: seen
      plant_override:
        contact:
          wheel_friction: [0.85, 0.008, 0.0015]
          floor_friction: [0.75, 0.004, 0.0004]

    - name: long_delay_seen
      role: seen
      plant_override:
        actuator:
          command_delay: 0.08

    - name: combined_unseen
      role: unseen
      plant_override:
        robot:
          chassis_mass: 12.0
          chassis_inertia: [0.11, 0.16, 0.22]
        actuator:
          command_delay: 0.10
          torque_limit: 1.8
          kp: 0.48
        contact:
          wheel_friction: [0.72, 0.006, 0.001]
          floor_friction: [0.60, 0.003, 0.0003]
