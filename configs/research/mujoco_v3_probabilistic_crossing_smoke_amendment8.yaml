include: mujoco_v3_probabilistic_crossing_smoke_amendment6.yaml

experiment:
  name: mujoco_v3_probabilistic_crossing_smoke_amendment8

planner:
  probabilistic_obstacle_candidate_filter_enabled: true
  probabilistic_obstacle_hard_violation_action: active_avoidance
  probabilistic_obstacle_speed_governor_enabled: false

perception:
  scan_guard:
    dynamic_escape_enabled: true
    dynamic_escape_max_speed: 0.35
    dynamic_escape_min_risk_improvement: 0.05
    dynamic_escape_match_tolerance_m: 0.12

online_smoke:
  output_dir: research_artifacts/mujoco_v3_probabilistic_crossing_smoke_amendment8

scope_guards:
  active_avoidance_selection_rule_frozen_before_run: true

design_amendment:
  version: 8
  reason: amendment7_showed_that_unconditional_stopping_can_leave_the_robot_inside_a_dynamic_crossing_lane
  intervention:
    name: feasibility_first_active_avoidance
    candidate_budget_changed: false
    probability_model_changed: false
    hard_probability_threshold_changed: false
    selection_rule:
      - filter_candidates_by_the_existing_hard_probability_threshold
      - if_the_weighted_trajectory_is_unsafe_choose_the_lowest_cost_safe_candidate
      - if_no_safe_candidate_exists_compare_the_minimum_risk_active_candidate_with_stopping
      - stop_only_when_stopping_has_no_greater_maximum_probability
  independent_unit: complete_episode
  blocking_factor: obstacle_process_seed
  paired_seeds: [730100001, 730100003, 730100005]
  primary_endpoints:
    - collision
    - goal_reached
    - minimum_clearance_m
  diagnostic_endpoints:
    - active_fallback_count
    - active_fallback_fraction
    - candidate_feasible_fraction
    - localization_position_rmse_m
    - planner_p95_compute_ms
  obstacle_generator_changed: false
  predictor_changed: false
  risk_definition_changed: false
  residual_model_changed: false
  localization_changed: false
  seeds_changed: false
  route_changed: false
  gate_changed: false
