include: mujoco_v3_probabilistic_crossing_smoke_amendment8.yaml

experiment:
  name: mujoco_v3_probabilistic_crossing_smoke_amendment9

perception:
  temporal_scan_guard:
    enabled: true
    safety_enabled: false
    field_of_view_deg: 270.0
    window_beams: 7
    minimum_support_beams: 3
    maximum_clearance_m: 1.50
    hold_s: 0.20
  scan_guard:
    dynamic_escape_reactive_enabled: true
    dynamic_escape_trigger_ttc_s: 1.20
    dynamic_escape_turn_gain: 1.50
    dynamic_escape_min_speed: 0.20
    dynamic_escape_flow_angle_tolerance_deg: 20.0

online_smoke:
  output_dir: research_artifacts/mujoco_v3_probabilistic_crossing_smoke_amendment9

design_amendment:
  version: 9
  reason: amendment8_active_candidate_was_selected_but_started_after_the_predictor_change_point_and_left_insufficient_evasion_time
  intervention:
    name: lidar_ttc_triggered_turn_away
    activation:
      - active_avoidance_mode_is_enabled
      - robust_scan_flow_matches_the_tracked_dynamic_obstacle_bearing
      - lidar_ttc_is_at_most_1p20_seconds
    action:
      - preserve_bounded_forward_escape_speed
      - turn_toward_the_heading_opposite_the_obstacle
    simulator_truth_used: false
  obstacle_generator_changed: false
  predictor_changed: false
  risk_definition_changed: false
  hard_probability_threshold_changed: false
  residual_model_changed: false
  localization_changed: false
  seeds_changed: false
  route_changed: false
  gate_changed: false
