analysis:
  safe_success: goal_distance_le_0.30_within_400_steps_no_collision_no_boundary_violation
  primary_contrast: B11_full_proposed_minus_B00_strong_nominal_mppi
  alpha: 0.05
  statistical_confirmation: positive_difference_exact_mcnemar_p_lt_0.05_and_two_sided_95ci_lower_gt_0
  practical_confirmation: statistical_confirmation_and_point_estimate_ge_0.10
  collision_endpoint_name: collision_rate
  predicted_quantity_name: predicted_collision_risk
  paired_binary_ci: tango_matched_score
  tango_root_tolerance: 1.0e-12
  collision_noninferiority_margin: 0.02
  split_success_harm_margin: -0.05
  split_collision_harm_margin: 0.05
  bootstrap_replicates: 200000
  bootstrap_seed: 741990047
  mechanism_multiplicity: holm_three_contrasts
  ablation_multiplicity: holm_three_contrasts
  timestep_as_independent_sample: false
  outcome_unlock_rule: all_360_seed_blocks_and_1860_episode_jobs_complete_before_first_metric_read
  primary_binary_endpoints: [safe_success, collision_rate]
  primary_continuous_endpoints:
    - failure_penalized_steps
    - final_goal_distance
    - path_progress_m_max
    - minimum_clearance
    - conflict_q05_clearance
  supportive_continuous_endpoints:
    - trajectory_length
    - applied_control_jerk
    - stuck_steps
    - spin_steps
    - direction_switch_count
    - three_phase_oscillation_count
    - premature_reverse_count
    - release_delay_max_s
    - conflict_traversal_time_failure_penalized_s
    - zero_speed_risk_steps
  mechanism_confirmatory_family:
    endpoint: safe_success
    contrasts: [learning_main, probability_main, learning_by_probability_interaction]
    test: two_sided_wilcoxon_pratt_normal_approximation_on_whole_seed_contrast
    correction: holm
  ablation_confirmatory_family:
    endpoint: safe_success
    contrasts:
      - B11_full_proposed_minus_A_full_ordinary_imm
      - B11_full_proposed_minus_A_no_icode
      - B11_full_proposed_minus_A_fixed_hss
    test: two_sided_exact_mcnemar
    correction: holm
  boundary_violation_policy: >-
    structural_zero_when_the_frozen_point_goal_scene_has_no_corridor_or_world_boundary;
    otherwise_use_boundary_violation_steps_from_metrics
  conflict_q05_no_observed_sample_policy: use_episode_minimum_clearance_and_flag_fallback
  behavior_timing_status: concurrent_ecs_values_are_health_telemetry_only

