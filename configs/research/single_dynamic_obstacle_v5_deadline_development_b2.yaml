# B2 changes experimental structure rather than tuning the observed B1
# deadline parameters. The candidate starts from frozen V4 Full and adds only
# the online deadline-feasibility supervisor. No dynamic_recovery_* override is
# present; the candidate therefore inherits exactly the frozen V4 recovery
# behavior, so any paired effect is attributable to the deadline mechanism.
candidate_overrides:
  dynamic_deadline_supervisor_enabled: true
  dynamic_deadline_episode_steps: 400
  dynamic_deadline_control_period_s: 0.10
  dynamic_deadline_position_tolerance_m: 0.30
