schema_version: 1
design_id: l88_covariance_context_train_expansion_v1
base_config: configs/rl/sac_mppi_covariance_only_l84.yaml
schedule_seed: 2026071803
bootstrap_seed: 2026071804
selection_seeds: [20269501, 20269502, 20269503]
evaluation_seeds: [20269601, 20269602, 20269603]
selection_rmse_slack_m: 0.002
evaluation_rmse_noninferiority_margin_m: 0.002

# These two paths extend the contextual-policy training support.  The L87
# hairpin and reverse-S paths remain completely absent from this collection so
# that they can later serve as held-out geometry tests.
scenes:
  - configs/research/mujoco_high_dynamic_accel_straight_l56.yaml
  - configs/research/mujoco_high_dynamic_sweep_l56.yaml

physics_domains:
  - name: train_anchor
    plant_override: {}
  - name: friction_high
    plant_override:
      contact:
        wheel_friction: [0.90, 0.007, 0.0011]
        floor_friction: [0.80, 0.004, 0.0004]
  - name: delay_long
    plant_override:
      actuator:
        command_delay: 0.10
  - name: combined_moderate
    plant_override:
      robot:
        chassis_mass: 15.0
        chassis_inertia: [0.15, 0.219, 0.311]
        wheel_mass: 0.40
      actuator:
        torque_limit: 1.20
        kp: 0.32
        ki: 1.00
        command_delay: 0.08
        torque_slew_rate: 20.0
      contact:
        wheel_friction: [0.78, 0.0062, 0.0010]
        floor_friction: [0.70, 0.0035, 0.00035]

candidates:
  - {name: narrow, scale: [0.5, 0.5]}
  - {name: speed, scale: [1.75, 0.75]}
