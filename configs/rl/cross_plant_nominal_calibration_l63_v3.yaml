include: cross_plant_nominal_calibration_l63_v2.yaml

experiment:
  name: cross_plant_nominal_calibration_l63_v3
  output_dir: results/research_platform/rl/l63_cross_plant_nominal_calibration_20260716_v3

rl:
  cross_layer_factorial:
    design_id: l63_nominal_only_cross_plant_calibration_v3
    schedule_seed: 2026071646
    bootstrap_seed: 2026071647
    development_episode_seeds: [21860807, 21860808, 21860809]
    # The four v2 single-factor selections are frozen. Only the combined
    # candidate strength changes after v2 proved the extreme combination was
    # measurable but ineligible (50% success and 92.7% completion).
    physics_domains:
      - {name: train_anchor, role: anchor, plant_override: {}}
      - name: mass_light
        role: mass_candidate
        plant_override:
          robot:
            chassis_mass: 10.0
            chassis_inertia: [0.10, 0.146, 0.208]
            wheel_mass: 0.34
      - name: friction_high
        role: friction_candidate
        plant_override:
          contact:
            wheel_friction: [0.90, 0.007, 0.0011]
            floor_friction: [0.80, 0.004, 0.0004]
      - name: torque_weak_v2
        role: torque_candidate
        plant_override:
          actuator:
            torque_limit: 0.75
            kp: 0.20
            ki: 0.65
            torque_slew_rate: 10.0
      - name: delay_long
        role: delay_candidate
        plant_override:
          actuator:
            command_delay: 0.10
      - name: combined_moderate_a
        role: combined_candidate
        plant_override:
          robot:
            chassis_mass: 15.0
            chassis_inertia: [0.15, 0.219, 0.311]
            wheel_mass: 0.40
          actuator:
            torque_limit: 1.20
            kp: 0.32
            ki: 1.00
            command_delay: 0.08
            torque_slew_rate: 20.0
          contact:
            wheel_friction: [0.78, 0.0062, 0.0010]
            floor_friction: [0.70, 0.0035, 0.00035]
      - name: combined_moderate_b
        role: combined_candidate
        plant_override:
          robot:
            chassis_mass: 14.5
            chassis_inertia: [0.145, 0.212, 0.301]
            wheel_mass: 0.40
          actuator:
            torque_limit: 1.00
            kp: 0.28
            ki: 0.90
            command_delay: 0.08
            torque_slew_rate: 16.0
          contact:
            wheel_friction: [0.82, 0.0065, 0.0010]
            floor_friction: [0.74, 0.0037, 0.00037]

cross_plant_calibration:
  groups:
    mass: [mass_light]
    friction: [friction_high]
    torque: [torque_weak_v2]
    delay: [delay_long]
    combined: [combined_moderate_a, combined_moderate_b]
