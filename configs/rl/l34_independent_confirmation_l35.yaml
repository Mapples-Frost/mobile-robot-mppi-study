        path: results/research_platform/rl/dynamic_history_bounded_l34_seed20260731_30k_20260716_v1
      - training_seed: 20260732
        best_step: 30000
        path: results/research_platform/rl/dynamic_history_bounded_l34_seed20260732_30k_20260716_v1
      - training_seed: 20260733
        best_step: 15000
        path: results/research_platform/rl/dynamic_history_bounded_l34_seed20260733_30k_20260716_v1
