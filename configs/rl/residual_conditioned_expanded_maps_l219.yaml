include: residual_conditioned_direct_control_sac_l204.yaml

experiment:
  name: residual_conditioned_expanded_maps_l219
  output_dir: results/research_platform/rl/residual_conditioned_expanded_maps_l219

# Development-only Actor adaptation for the six L218 MuJoCo maps.  The paper
# mechanism is unchanged: this Actor supplies a residual-conditioned proposal
# and HSS retains authority to reject it.  Sealed evaluation seeds are never
# used here.
planner:
  device: auto
  residual_torch_num_threads: 1
  residual_state_canonicalization:
    enabled: true
    state_names: [x, y]
    values: [3.2452182770, 0.3136115074]

rl:
  policy_id: residual_conditioned_expanded_maps_l219
  reward:
    path_progress_weight: 14.0
    cross_track_penalty_weight: 4.0
    heading_error_penalty_weight: 0.35
    safety_override_penalty: 0.20
    control_rate_weight: 0.05
  sac:
    policy_mode: direct
    actor_lr: 0.0001
    critic_lr: 0.0003
    alpha_lr: 0.0001
    initial_alpha: 0.08
    minimum_alpha: 0.01
    actor_group_robust_enabled: true
    actor_group_robust_temperature: 0.10
  training:
    total_steps: 30000
    warmup_steps: 0
    warmup_policy: actor
    update_after: 1000
    actor_update_after: 3000
    batch_size: 256
    replay_capacity: 250000
    replay_sampling: scene_balanced
    # The pool expands six maps across multiple physics-domain variants.  A
    # strict all-groups latch can suppress every update when long episodes do
    # not visit all combinations early. Scene-balanced replay already prevents
    # visited maps from dominating, so begin updates once the normal SAC warmup
    # is met and audit group coverage separately.
    replay_require_all_scenes: false
    updates_per_step: 1
    evaluation_interval: 5000
    evaluation_episodes: 1
    checkpoint_interval: 5000
    evaluate_initial_policy: true
    normalizer_update: online
    save_replay_buffer: false
    seed: 20262191
    validation_seed_base: 20262791
    device: auto
    scene_configs:
      - configs/research/mujoco_l218_serpentine_polyline.yaml
      - configs/research/mujoco_l218_giant_u_polyline.yaml
      - configs/research/mujoco_l218_opposed_u_polyline.yaml
      - configs/research/mujoco_l218_nested_u_polyline.yaml
      - configs/research/mujoco_l218_cylinder_forest_polyline.yaml
      - configs/research/mujoco_l218_cylinder_spiral_polyline.yaml
    validation_scene_configs:
      - configs/research/mujoco_l218_serpentine_polyline.yaml
      - configs/research/mujoco_l218_giant_u_polyline.yaml
      - configs/research/mujoco_l218_opposed_u_polyline.yaml
      - configs/research/mujoco_l218_nested_u_polyline.yaml
      - configs/research/mujoco_l218_cylinder_forest_polyline.yaml
      - configs/research/mujoco_l218_cylinder_spiral_polyline.yaml
    physics_domain_config: configs/research/mujoco_physics_domains.yaml
    training_domain_roles: [seen, unseen]
    validation_domain_roles: [seen, unseen]
