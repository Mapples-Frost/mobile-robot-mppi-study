# SCOUT MINI / Livox Mid-360 calibrated adapter, 2026-08-03.
#
# Coordinate convention: base +x forward, +y left, +z up.  The Mid-360 raw
# axes are mechanically aligned to the same yaw convention (connector faces
# rearward).  Rotation comes from a 322,656-point stationary floor fit; it
# levels the measured normal [-0.3795102312, -0.0119430300, 0.9251104520].
# Translation uses the SCOUT MINI 451 mm wheelbase, the photographed mount
# alignment over the front axle, and the centred 50 x 48 cm box validation.
# The resulting box face is 2.381 m from the base origin, or 2.075 m beyond
# the 612 mm chassis front, consistent with the approximately 2 m placement.
lidar_to_base:
  - [0.925184544379, -0.002354411435, 0.379510231205, 0.2255]
  - [-0.002354411435, 0.999925907646, 0.011943029960, 0.0254]
  - [-0.379510231205, -0.011943029960, 0.925110452025, 0.495727690099]
  - [0.0, 0.0, 0.0, 1.0]
angle_min_rad: -3.141592653589793
angle_max_rad: 3.141592653589793
beam_count: 720
range_min_m: 0.15
range_max_m: 12.0
# Floor fit residual P95 is 8.5 mm.  Eight centimetres removes floor returns
# while retaining low obstacles well below the physical bumper height.
minimum_z_m: 0.08
maximum_z_m: 1.80
minimum_reflectivity: 0
# SCOUT MINI external envelope is 612 x 580 mm.  A 10 mm tolerance removes
# body/mount returns without hiding the large region used by the old
# provisional +/-0.45 x +/-0.40 m bounds.
self_min_x_m: -0.316
self_max_x_m: 0.316
self_min_y_m: -0.300
self_max_y_m: 0.300
self_min_z_m: -0.05
self_max_z_m: 0.80
frame_id: livox_base_scan_pi5_calibrated
