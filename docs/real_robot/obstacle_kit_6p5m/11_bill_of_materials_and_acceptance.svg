    <text style="font: 11px 'Microsoft YaHei'" transform="translate(23.92799 406.708993)">材料：墙板/底座 6 mm、八边形侧板 4 mm 不透明哑光浇铸 PMMA；外露边安装透明硅胶 U 形护边。</text>
    <text style="font: 11px 'Microsoft YaHei'" transform="translate(23.92799 423.072868)"/>
    <text style="font: 11px 'Microsoft YaHei'" transform="translate(23.92799 440.102758)">连接件：直连 12、90° 6、T 形 2。另购 50 mm 黑/黄哑光地贴、卷尺、激光测距仪、AprilTag/ArUco ID、防滑垫。</text>
    <text style="font: 11px 'Microsoft YaHei'" transform="translate(23.92799 456.530227)"/>
    <text style="font: 11px 'Microsoft YaHei'" transform="translate(23.92799 472.894102)">下单前强制复测：①车体最大外接轮廓；②雷达光束离地高度（当前兼容 100–250 mm）；③材料样片回波；④急停距离；⑤首件推力/倾倒稳定性。</text>
    <text style="font: 11px 'Microsoft YaHei'" transform="translate(23.92799 489.257977)"/>
    <text style="font: 11px 'Microsoft YaHei'" transform="translate(23.92799 505.621852)">供应商验收：尺寸公差、圆角倒钝、哑光不透明表面、粘接质量、护边、防滑、连接缝、无突出支脚。</text>
   </g>
