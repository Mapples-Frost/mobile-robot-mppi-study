include: expanded_navigation_path_preview_l222.yaml

# L223 development-only simulator calibration. The guard remains enabled and
# retains a 0.07 m geometric buffer outside the 0.25 m collision body. These
# values are shared by every benchmark arm and must never be inherited by the
# ROS/real-robot configuration.
final_benchmark:
  status: development
  preregistration: docs/rl/233_l223_bounded_simulation_guard_protocol_2026-07-20.md
  scan_guard_overrides:
    near_body_stop_radius: 0.32
    side_stop_distance: 0.32
    hard_stop_distance: 0.34
    front_stop_distance: 0.34
    front_soft_block_distance: 0.48
    front_soft_block_max_speed: 0.06
    front_slow_distance: 0.85
    front_slow_min_scale: 0.45

