held_constant:
  noise_basis: ar1:2.0
  rationale: 'The deadlock under test only appears reliably under AR(1): 6/12 AR(1)
    episodes terminated in the barrier cluster at (1.2, -2.05) versus 3/12 for i.i.d.,
    and only the AR(1) timeouts clustered. Holding AR(1) in BOTH arms isolates the
    thickness convention. Consequence: results describe the AR(1) configuration, not
    the frozen i.i.d. baseline, and must be reported that way.'
intervention:
  control: false
  parameter: planner.known_static_map_segment_half_thickness
  treatment: true
known_open_risks:
- detail: 'The bug is confirmed, but its quantitative effect on the candidate feasible
    fraction was NOT established offline: the reconstruction in static_filter_coverage_v1
    was ~56x off the recorded value and its section 3 is void. This experiment is
    the first real measurement of the effect.'
  id: effect_size_unquantified
- detail: legacy_pipeline.py:151 also uses full thickness, but for dynamic-track matching
    where over-inclusion is conservative in the safe direction. static_astar.py:149
    uses it for search-region padding. Neither is changed.
  id: other_full_thickness_sites
- detail: This is the first change in this workstream that makes the planner LESS
    conservative. The FAIL_SAFETY rule is correspondingly stricter and includes a
    clearance-regression trigger.
  id: reduced_conservatism
map:
  name: chapter1
  reason: All 36 static obstacles are segments, so the defect applies to every one
    of them, and the recorded deadlock is on this map.
mechanism_family: static_map_geometry_convention
power_statement: TWELVE PAIRS IS A SCREENING SAMPLE. It cannot support a statistical
  claim and no p-value governs the decision. Its purpose is to decide whether a confirmatory
  run is warranted, and to detect a safety regression early.
prohibitions:
- no formal server experiment
- no training
- no MuJoCo viewer during measured episodes
- no seed replacement after any outcome is seen
- failure evidence retained verbatim, never overwritten
- the default value of the flag is not changed by this protocol regardless of outcome
protocol: segment_half_thickness_ab_development_v1
question: Correcting the planner's segment-clearance convention from full thickness
  to half thickness makes the known-static-map model agree with the geometry MuJoCo
  actually builds. Does that correction relieve the chapter-1 candidate starvation
  and the resulting deadlock, without causing static collisions?
schema_version: 1
status: frozen_before_execution
