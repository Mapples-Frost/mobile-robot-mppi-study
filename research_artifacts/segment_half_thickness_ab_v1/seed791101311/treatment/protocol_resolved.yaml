confound_control:
  correction: The co-primary here is computed ONLY over pairs whose outcome type is
    identical in both arms. The changed-outcome stratum is reported separately and
    is not gating. This is pre-specified, not chosen after seeing results.
  issue: 'In the noise-basis screen the median paired goal-distance gain (0.283 m)
    was produced ENTIRELY by pairs whose outcome type changed (collision to timeout):
    median +2.95 m in that stratum versus -0.025 m where the outcome type was unchanged.
    The endpoint measured survival time, not navigation quality.'
decision_rule:
  evaluated_after: all_24_episodes_complete
  order: safety_first
  rules:
  - action: stop, seal, revert the flag to false, do not run a confirmatory. A conservatism
      reduction that costs clearance is not acceptable even if it improves completion.
    condition: two or more pairs in which the treatment collides and the paired control
      does not, OR the median paired reduction in true minimum clearance exceeds 0.05
      m
    id: FAIL_SAFETY
  - action: pre-register and run a confirmatory at n >= 20 fresh paired seeds
    condition: FAIL_SAFETY not triggered AND (net safe_success improvement at least
      +2 pairs OR same-outcome-stratum median goal-distance reduction at least 0.25
      m)
    id: PASS_TO_CONFIRMATORY
  - action: report that the correction is geometrically right but does not relieve
      the chapter-1 deadlock; keep the flag available and default false
    condition: neither of the above
    id: FAIL_NO_EFFECT
  thresholds:
    median_goal_distance_reduction_m: 0.25
    minimum_clearance_regression_m: 0.05
    net_success_pairs: 2
    treatment_only_collision_pairs: 2
defect_under_test:
  corrected_expression: surface_distance = centerline_distance - 0.5 * thickness
  direction: The correction REDUCES planner conservatism. It admits candidates previously
    rejected. Static collision risk is the specific hazard this protocol tests.
  ground_truth: model_factory.py:47 builds a segment as a MuJoCo box with half-extents
    (0.5 * length, 0.5 * thickness). mujoco_plant.py:743, scene_feasibility.py:19
    and static_astar.py:54 all measure against 0.5 * thickness. static_astar.py carries
    an explicit comment stating this rule. Only the MPPI cost path subtracts the full
    thickness.
  legacy_expression: surface_distance = centerline_distance - thickness
  measured_error: Exactly 0.1000 m at all five recorded chapter-1 deadlock states;
    predicted range 0.100-0.140 m for the map's thickness values {0.20, 0.21, 0.22,
    0.28}. Chapter-1 corridors carry ~0.17-0.19 m of true margin.
  site: src/mobile_robot_mppi/planning/mppi.py, _known_static_map_clearance, segment
    branch
